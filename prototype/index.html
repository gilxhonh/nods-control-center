};

SCREENS.client = id => {
  const k = CLIENTS[id] ? id : 'nike'; const c = CLIENTS[k]; const s = clientStats(k);
  const doms = s.ds.slice().sort(sortDom);
  const trend = Array.from({ length: 12 }, (_, i) => +(s.ds.reduce((a, d) => a + d.history[i].coverage, 0) / s.ds.length).toFixed(1));
  const impact = s.iss.length ? `${s.iss.length} domain${s.iss.length > 1 ? 's' : ''} ${s.iss.length > 1 ? 'have' : 'has'} problems in the current window. ${s.iss.filter(d => d.status === 'lowcount').length ? `Low counts on ${s.iss.filter(d => d.status === 'lowcount').map(d => d.domain).join(', ')} could reduce Friday's delivery if not recovered. ` : ''}${s.iss.filter(d => d.status === 'blocked').map(d => `${d.domain} is blocked by the site (${d.block.scope.toLowerCase()}) since ${fmtD(d.block.since)}: ${d.block.impact} Expected recovery: ${d.block.eta}. `).join('')}${s.iss.filter(d => d.status === 'failed').length ? `${s.iss.filter(d => d.status === 'failed').map(d => d.domain).join(', ')} failed and needs a restart. ` : ''}Delivery engineers are working on it${s.ot.length ? ` under ${s.ot.map(t => t.id).join(', ')}` : ''}.` : 'No operational problems. All runs are on track for delivery.';
  const acts = [];
  s.ot.forEach(t => acts.push({ at: t.created, t: `${t.id} opened · ${t.reason} on ${t.domain}`, i: 'ticket' }));
  TICKETS.filter(t => t.client === k && !isOpen(t)).slice(0, 3).forEach(t => acts.push({ at: t.created, t: `${t.id} resolved · ${t.reason} on ${t.domain}`, i: 'check' }));
  s.ds.filter(d => d.status === 'done').forEach(d => acts.push({ at: new Date(d.started.getTime() + 22 * 36e5), t: `${d.domain} completed at ${pct(cov(d))}`, i: 'activity' }));
  return `${crumbs([['Clients', 'clients'], [c.name]])}
  <div class="ph"><div><h1>${c.name} ${toneChip(s.health[0], s.health[1], s.health[2])}</h1><p>${c.tier} · ${c.region} · client since ${c.since} · ${c.contract}</p></div><div class="ph-r"><button class="btn" data-act="ext" data-id="Slack #ops-${c.name.toLowerCase().replace(/[^a-z]/g, '')}">${ic('hash', 'sm')}Client channel</button><button class="btn" data-act="ext" data-id="Jira filter for ${c.name}">${ic('ticket', 'sm')}Jira filter</button></div></div>
  <div class="stats"><div><label>CSM</label><b style="font-size:14px;padding-top:5px">${who(c.csm, false)}</b></div><div><label>Domains</label><b>${s.ds.length}</b></div><div><label>Active runs</label><b>${s.act.length}</b></div><div><label>Healthy</label><b><i style="background:var(--ok-fill)"></i>${s.healthy}</b></div><div><label>At risk</label><b><i style="background:var(--serious-fill)"></i>${s.iss.length}</b></div><div><label>Open tickets</label><b>${s.ot.length}</b></div><div><label>Stores</label><b>${fmtN(s.ds.reduce((a, d) => a + d.cfg.stores, 0))}</b></div><div><label>Stores missing / low</label><b><i style="background:var(--crit-fill)"></i>${s.ds.reduce((a, d) => a + d.cfg.missStores, 0)} / ${s.ds.reduce((a, d) => a + d.cfg.lowStores, 0)}</b></div></div>
  <div class="banner ${s.worst === 'ok' ? 'info' : s.worst === 'crit' ? 'crit' : 'serious'}">${ic(s.worst === 'ok' ? 'check' : 'alert')}<span><b>Client impact:</b> ${impact}</span>${S.role === 'csm' ? `<div class="r"><button class="btn sm" data-act="copy-impact" data-id="${esc(impact)}">${ic('copy', 'sm')}Copy update</button></div>` : ''}</div>
  <div class="grid g-main2">
    <div class="stack">
      ${s.ds.filter(d => d.status === 'blocked').map(d => `<div class="card blk-card"><div class="card-h"><h3>${ic('ban', 'sm')}${d.domain} is blocked</h3><span class="chip blk">${d.block.scope}</span><span class="sub">since ${fmtD(d.block.since)}</span><div class="r"><button class="btn ghost sm" data-nav="domain" data-id="${d.id}">Details ${ic('right', 'sm')}</button></div></div><div class="card-b" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px"><div><label class="muted" style="font-size:11.5px;display:block">What the client sees</label>${d.block.impact}</div><div><label class="muted" style="font-size:11.5px;display:block">What we are doing</label>${d.block.workaround}</div><div><label class="muted" style="font-size:11.5px;display:block">Expected recovery</label><b>${d.block.eta}</b><div class="muted" style="font-size:12px">Owner: ${d.maint ? P[d.maint].name : 'unassigned'}</div></div></div></div>`).join('')}
      <div class="card"><div class="card-h"><h3>Domains</h3><span class="sub">${s.ds.length} domains · problems first</span></div><div class="tw"><table class="t"><thead><tr><th></th><th>Domain</th><th>Delivery engineer</th><th>Scrape type</th><th>Run status</th><th>Progress</th><th>Coverage</th><th class="r">Open tickets</th><th>Next window</th></tr></thead><tbody>
      ${doms.map(d => `<tr class="${['running', 'done', 'waiting'].includes(d.status) ? 'quiet' : ''}" data-nav="domain" data-id="${d.id}"><td class="sevc"><i class="sev ${ISSUE.includes(d.status) ? ST[d.status].tone : ''}"></i></td><td>${domLink(d.id)}</td><td>${who(d.maint)}</td><td>${d.type}</td><td>${chip(d.status)}</td><td>${d.status === 'waiting' ? '<span class="muted">—</span>' : progBar(d.progress, d.status === 'running' ? 'info' : ST[d.status].tone)}</td><td>${covCell(cov(d), d.status)}</td><td class="r">${d.tickets.filter(isOpen).length || '<span class="muted">0</span>'}</td><td>${fmtD(d.nextStart)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h3>Coverage trend</h3><span class="sub">average across ${c.name} domains · last 12 runs</span></div><div class="card-b"><div class="lg"><span><i class="ln" style="background:var(--s1)"></i>Avg coverage</span><span><i class="dsh"></i>Threshold</span></div>${lineChart({ labels: WEEKS.map(fmtShort), series: [{ name: 'Avg coverage', color: 'var(--s1)', values: trend }], yMin: 80, yMax: 105, threshold: 90, h: 180, fmt: v => v.toFixed(1) + '%', yFmt: v => Math.round(v) + '%' })}</div></div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Open incidents</h3><span class="sub">${s.ot.length}</span></div><div>${s.ot.map(t => `<div class="li" data-act="ticket" data-id="${t.id}"><span class="sev ${t.pri === 'P1' ? 'crit' : 'serious'}" style="height:28px"></span><div class="grow"><b><span class="mono" style="color:var(--accent)">${t.id}</span> · ${t.reason}</b><span>${t.domain} · ${t.maint ? P[t.maint].name : 'Unassigned'} · ${ago(t.created)}</span></div>${prio(t.pri)}</div>`).join('') || '<div class="empty">No open incidents.</div>'}</div></div>
      ${nextDeliveriesCard(s.ds, 'Delivery schedule', 8)}
      <div class="card"><div class="card-h"><h3>Historical issues</h3><span class="sub">last 12 weeks</span></div><div class="card-b">${hBars(s.ds.map(d => ({ label: d.domain, value: d.history.filter(h => h.coverage < 90).length + d.tickets.length, nav: ['domain', d.id] })).filter(x => x.value).sort((a, b) => b.value - a.value).slice(0, 6), { color: 'var(--s2)', fmt: v => v + ' incidents' }) || '<span class="muted">No incidents.</span>'}</div></div>
      <div class="card"><div class="card-h"><h3>Recent activity</h3></div><div>${acts.sort((a, b) => b.at - a.at).slice(0, 7).map(a => `<div class="li" style="cursor:default">${ic(a.i, 'sm')}<div class="grow"><b style="font-weight:400">${a.t}</b><span>${ago(a.at)}</span></div></div>`).join('')}</div></div>
    </div>
  </div>`;
};

/* ---------- Team ---------- */
function memberStats(m) {
  const ds = DOMAINS.filter(d => d.maint === m); const act = ds.filter(d => ACTIVE.includes(d.status));
  const ot = TICKETS.filter(t => t.maint === m && isOpen(t));
  const lowHist = ds.reduce((a, d) => a + d.history.filter(h => h.coverage < 90).length, 0);
  const score = act.length + 2 * ds.filter(d => ISSUE.includes(d.status)).length + ot.length;
  const level = score >= 15 ? 'High' : score >= 11 ? 'Elevated' : score >= 5 ? 'Normal' : 'Light';
  const weekly = Array.from({ length: 12 }, (_, i) => ds.filter(d => d.history[i].coverage < 90).length);
  return { ds, act, ot, lowHist, level, score, weekly, healthy: act.filter(d => d.status === 'running').length, risk: act.filter(d => ['atrisk', 'delayed', 'lowcount'].includes(d.status)).length, failed: act.filter(d => d.status === 'failed' || d.status === 'blocked').length, iss: ds.filter(d => ISSUE.includes(d.status)) };
}
SCREENS.team = () => {
  const pod = F('tmPod', 'all');
  const ms = MAINT.filter(m => pod === 'all' || P[m].pod === pod).map(m => ({ m, s: memberStats(m) })).sort((a, b) => b.s.score - a.s.score);
  const tot = k => ms.reduce((a, r) => a + (typeof r.s[k] === 'number' ? r.s[k] : r.s[k].length), 0);
  return `${crumbs([['Team'], ['Delivery engineers']])}<div class="ph"><div><h1>Team Operations</h1><p>Workload and problems per delivery engineer. Sorted by workload so overloaded people surface first.</p></div><div class="ph-r">${tabs('tmPod', [['all', 'All pods'], ['EU Retail', 'EU Retail'], ['US Commerce', 'US Commerce']], 'all')}${canEdit() ? `<button class="btn" data-go="assign">${ic('shuffle', 'sm')}Assignments</button>` : ''}</div></div>
  <div class="stats"><div><label>Delivery engineers</label><b>${ms.length}</b></div><div><label>Domains</label><b>${tot('ds')}</b></div><div><label>Active runs</label><b>${tot('act')}</b></div><div><label>Issues</label><b><i style="background:var(--crit-fill)"></i>${tot('iss')}</b></div><div><label>Open tickets</label><b>${tot('ot')}</b></div><div><label>Unassigned domains</label><b><i style="background:var(--border-2)"></i>${DOMAINS.filter(d => !d.maint).length}</b></div></div>
  ${ms.some(r => r.s.level === 'High') ? `<div class="banner serious">${ic('users')}<span><b>${ms.filter(r => r.s.level === 'High').map(r => P[r.m].name).join(', ')}</b> ${ms.filter(r => r.s.level === 'High').length > 1 ? 'are' : 'is'} carrying a high load with ${ms.filter(r => r.s.level === 'High').reduce((a, r) => a + r.s.iss.length, 0)} open issues. Consider reassigning healthy domains.</span>${canEdit() ? `<div class="r"><button class="btn sm" data-go="assign">Rebalance</button></div>` : ''}</div>` : ''}
  <div class="card"><div class="tw"><table class="t"><thead><tr><th>Delivery engineer</th><th>Pod</th><th class="r">Assigned domains</th><th class="r">Active runs</th><th class="r">Healthy</th><th class="r">At risk</th><th class="r">Failed / blocked</th><th class="r">Open tickets</th><th>Deliveries (week)</th><th>Low-count history</th><th>Workload</th><th>Current problems</th></tr></thead><tbody>
  ${ms.map(({ m, s }) => `<tr data-act="member" data-id="${m}"><td>${who(m, false)}</td><td class="fg2">${P[m].pod}</td><td class="r num">${s.ds.length}</td><td class="r num">${s.act.length}</td><td class="r num" style="color:var(--ok)">${s.healthy}</td><td class="r num">${s.risk ? `<b style="color:var(--serious)">${s.risk}</b>` : '<span class="muted">0</span>'}</td><td class="r num">${s.failed ? `<b style="color:var(--crit)">${s.failed}</b>` : '<span class="muted">0</span>'}</td><td class="r num">${s.ot.length}</td><td>${(xs => { const bad = xs.filter(x => ['missing', 'blocked', 'upload'].includes(x.st)).length, risk = xs.filter(x => x.st === 'atrisk').length, dn = xs.filter(x => x.st === 'delivered').length; return `<span class="num">${dn}/${xs.length} delivered</span>${bad ? ` · <b style="color:var(--crit)">${bad} missing</b>` : ''}${risk ? ` · <b style="color:var(--warn)">${risk} at risk</b>` : ''}`; })(DELIVERIES.filter(x => x.d.maint === m))}</td><td data-tip="<b>${s.lowHist} low-count runs</b><div>per week, last 12 weeks</div>"><div style="display:flex;align-items:center;gap:8px">${miniCols(s.weekly)}<span class="num">${s.lowHist}</span></div></td><td><div style="display:flex;align-items:center;gap:8px"><div class="cap"><i style="width:${Math.min(100, s.score / 20 * 100)}%;background:${s.level === 'High' ? 'var(--crit-fill)' : s.level === 'Elevated' ? 'var(--serious-fill)' : 'var(--s1)'}"></i></div><span class="lvl ${s.level}" style="text-align:left">${s.level}</span></div></td><td style="white-space:normal;max-width:230px">${s.iss.map(d => `<button class="ent" data-nav="domain" data-id="${d.id}">${d.domain}</button>`).join(', ') || '<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid g2 sec"><div class="card"><div class="card-h"><h3>Workload by delivery engineer</h3><span class="sub">domains by current state</span></div><div class="card-b"><div class="lg"><span><i style="background:var(--crit-fill)"></i>Issue</span><span><i style="background:var(--s1)"></i>Running</span><span><i style="background:var(--border-2)"></i>Completed / scheduled</span></div>${hBars(ms.map(({ m, s }) => ({ label: P[m].name, nav: null, parts: [{ n: 'Issue', v: s.iss.length, c: 'var(--crit-fill)' }, { n: 'Running', v: s.healthy, c: 'var(--s1)' }, { n: 'Completed / scheduled', v: s.ds.length - s.act.length, c: 'var(--border-2)' }] })), { fmt: v => v })}</div></div>
  <div class="card"><div class="card-h"><h3>Low-count incidents by delivery engineer</h3><span class="sub">last 12 weeks</span></div><div class="card-b">${hBars(ms.map(({ m, s }) => ({ label: P[m].name, value: s.lowHist })).sort((a, b) => b.value - a.value), { color: 'var(--s2)' })}</div></div></div>`;
};
function miniCols(v) { const mx = Math.max(2, ...v); return `<span style="display:inline-flex;gap:1px;align-items:flex-end;height:18px">${v.map(x => `<i style="width:4px;height:${Math.max(2, x / mx * 18)}px;background:${x ? 'var(--serious-fill)' : 'var(--border-2)'};border-radius:1px;display:block"></i>`).join('')}</span>`; }

function memberDrawer(m) {
  const s = memberStats(m); const tks = TICKETS.filter(t => t.maint === m).sort((a, b) => b.created - a.created).slice(0, 6);
  openDrawer(`${drHead(`${av(m, 'lg')} ${P[m].name}`, `${P[m].title} · ${P[m].pod} pod · reports to ${P[P[m].mgr].name}`, `<div style="margin-top:8px"><span class="lvl ${s.level}" style="text-align:left;width:auto">${s.level} workload</span></div>`)}
  <div class="dr-b">
    <div class="dr-sec"><div class="kv"><div><label>Assigned domains</label><b>${s.ds.length}</b></div><div><label>Active runs</label><b>${s.act.length}</b></div><div><label>Current problems</label><b style="color:${s.iss.length ? 'var(--crit)' : 'inherit'}">${s.iss.length}</b></div><div><label>Open tickets</label><b>${s.ot.length}</b></div></div></div>

    <div class="dr-sec"><h4>Historical low counts · ${s.lowHist} in 12 weeks</h4>${stackCols({ labels: WEEKS.map(w => w.getDate() + '/' + (w.getMonth() + 1)), series: [{ name: 'Low-count runs', color: 'var(--serious-fill)', values: s.weekly }], h: 120, w: 500, yMax: niceMax(Math.max(4, ...s.weekly)), tipLabel: i => 'Week of ' + fmtShort(WEEKS[i]) })}</div>
    <div class="dr-sec"><h4>Assigned domains</h4><div class="card"><div class="tw"><table class="t"><thead><tr><th>Domain</th><th>Client</th><th>Status</th><th>Coverage</th></tr></thead><tbody>${s.ds.slice().sort(sortDom).map(d => `<tr class="${ISSUE.includes(d.status) ? '' : 'quiet'}" data-nav="domain" data-id="${d.id}"><td>${d.domain}</td><td>${CLIENTS[d.client].name}</td><td>${chip(d.status)}</td><td>${covCell(cov(d), d.status)}</td></tr>`).join('')}</tbody></table></div></div></div>
    <div class="dr-sec"><h4>Recent tickets</h4><div class="card">${tks.map(t => `<div class="li" data-act="ticket" data-id="${t.id}"><div class="grow"><b><span class="mono" style="color:var(--accent)">${t.id}</span> · ${t.reason}</b><span>${t.domain} · ${ago(t.created)}</span></div><span class="tag">${t.status}</span></div>`).join('') || '<div class="empty">No tickets.</div>'}</div></div>
  </div>
  <div class="dr-f"><button class="btn" data-act="ext" data-id="Slack DM with ${P[m].name}">${ic('msg', 'sm')}Message</button>${canEdit() ? `<button class="btn primary" data-act="assignfor" data-id="${m}">${ic('shuffle', 'sm')}Manage assignments</button>` : ''}</div>`);
}
function attentionLite(d) { return `<div class="li" data-nav="domain" data-id="${d.id}"><span class="sev ${ST[d.status].tone}" style="height:28px"></span><div class="grow"><b>${d.domain}</b><span>${d.note}</span></div>${chip(d.status)}</div>`; }

/* ---------- Assignments ---------- */
SCREENS.assign = () => {
  const selM = F('asM', 'all'); const fc = F('asCl', 'all'); const un = F('asUn', 'no') === 'yes'; const q = F('asQ', '').toLowerCase();
  const list = DOMAINS.filter(d => (selM === 'all' || d.maint === selM) && (fc === 'all' || d.client === fc) && (!un || !d.maint) && (!q || d.domain.includes(q))).sort((a, b) => (!!a.maint - !!b.maint) || sortDom(a, b));

  return `${crumbs([['Team'], ['Assignments']])}<div class="ph"><div><h1>Assignments</h1><p>Assign and rebalance domains across delivery engineers. Capacity reflects active runs, open issues and tickets.</p></div><div class="ph-r">${!canEdit() ? `<span class="tag">${ic('lock', 'xs')}Read-only for ${ROLES[S.role].label}</span>` : ''}</div></div>
  <div class="asg">
    <div class="card" style="align-self:start"><div class="card-h"><h3>Team members</h3><span class="sub">${MAINT.length}</span></div>
      <button class="mem ${selM === 'all' ? 'on' : ''}" data-ft="asM" data-v="all"><span class="av md" style="--h:0">${ic('users', 'sm')}</span><div class="grow"><b>All domains</b><span>${DOMAINS.length} domains · ${DOMAINS.filter(d => !d.maint).length} unassigned</span></div></button>
      ${members.map(({ m, s }) => `<button class="mem ${selM === m ? 'on' : ''}" data-ft="asM" data-v="${m}">${av(m, 'md')}<div class="grow"><b>${P[m].name}</b><span>${s.ds.length} domains · ${s.iss.length} issues · ${P[m].pod}</span></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><div class="cap"><i style="width:${Math.min(100, s.score / 20 * 100)}%;background:${s.level === 'High' ? 'var(--crit-fill)' : s.level === 'Elevated' ? 'var(--serious-fill)' : 'var(--s1)'}"></i></div><span class="lvl ${s.level}">${s.level}</span></div></button>`).join('')}</div>

/* ---------- Data Explorer ---------- */
const QUERIES = [
  { id: 'latest', name: 'Latest run for domain', desc: 'Most recent run with counts', p: ['domain'] },
  { id: 'compare', name: 'Record count comparison', desc: 'Captured vs baseline, last 12 runs', p: ['domain'] },
  { id: 'clientreq', name: 'Client request history', desc: 'Master requests for a client', p: ['client'] },
  { id: 'domainhist', name: 'Domain run history', desc: 'Runs with duration and status', p: ['domain'] },
  { id: 'lowhist', name: 'Low count history', desc: 'Runs below threshold, all domains', p: [] },
  { id: 'failed', name: 'Failed runs', desc: 'Failed or delayed in current window', p: [] },
  { id: 'topprob', name: 'Top problem domains', desc: 'Incidents per domain, 90 days', p: [] },
];
function qSql(id, dom, cli) {
  return {
    latest: `SELECT run_id, domain, status, started_at,\n       captured_count, baseline,\n       round(captured_count::numeric / baseline * 100, 1) AS coverage\nFROM scraping_runs\nWHERE domain = '${dom}'\nORDER BY started_at DESC\nLIMIT 1;`,
    compare: `SELECT\n  run_id,\n  domain,\n  captured_count,\n  baseline,\n  captured_count::float / baseline * 100 AS coverage\nFROM scraping_runs\nWHERE domain = '${dom}'\nORDER BY created_at DESC;`,
    clientreq: `SELECT mr.request_id, mr.domain, mr.created_at,\n       mr.input_count, d.removed AS dedup_removed, mr.status\nFROM master_requests mr\nJOIN dedup_results d ON d.request_id = mr.request_id\nWHERE mr.client_id = '${cli}'\nORDER BY mr.created_at DESC\nLIMIT 50;`,
    domainhist: `SELECT run_id, started_at, finished_at,\n       extract(epoch FROM finished_at - started_at) / 3600 AS duration_h,\n       captured_count, status\nFROM scraping_runs\nWHERE domain = '${dom}'\nORDER BY started_at DESC;`,
    lowhist: `SELECT r.run_id, r.domain, c.name AS client, r.started_at,\n       round(r.captured_count::numeric / r.baseline * 100, 1) AS coverage,\n       t.jira_key\nFROM scraping_runs r\nJOIN clients c ON c.id = r.client_id\nLEFT JOIN generated_tickets t ON t.run_id = r.run_id\nWHERE r.captured_count < r.baseline * 0.90\n  AND r.started_at > now() - interval '90 days'\nORDER BY r.started_at DESC;`,
    failed: `SELECT run_id, domain, status, sequence_id,\n       last_heartbeat_at, error_message\nFROM scraping_runs\nWHERE window_id = current_window()\n  AND status IN ('failed', 'delayed')\nORDER BY last_heartbeat_at;`,
    topprob: `SELECT domain, count(*) AS incidents,\n       count(*) FILTER (WHERE reason = 'low_count') AS low_count,\n       max(created_at) AS last_incident\nFROM incidents\nWHERE created_at > now() - interval '90 days'\nGROUP BY domain\nORDER BY incidents DESC\nLIMIT 10;`,
  }[id];
}
function qRun(id, dom, cli) {
  const d = DM[dom] || DM['nike.com'];
  const iso = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')} ${hm(x)}`;
  switch (id) {
    case 'latest': return { cols: ['run_id', 'domain', 'status', 'started_at', 'captured_count', 'baseline', 'coverage'], rows: [[d.runId, d.domain, d.status, iso(d.started), d.captured, d.baseline, +cov(d).toFixed(1)]] };
    case 'compare': return { cols: ['run_id', 'domain', 'captured_count', 'baseline', 'coverage'], rows: [[d.runId, d.domain, d.captured, d.baseline, +cov(d).toFixed(2)], ...d.history.slice().reverse().map(h => [h.run, d.domain, h.captured, h.baseline, +(h.captured / h.baseline * 100).toFixed(2)])] };
    case 'clientreq': return { cols: ['request_id', 'domain', 'created_at', 'input_count', 'dedup_removed', 'status'], rows: DOMAINS.filter(x => x.client === cli).flatMap((x, i) => [0, 1, 2].map(w => [`MR-${55841 - i * 7 - w * 61}`, x.domain, iso(addDays(x.started, -7 * w)), Math.round(x.baseline / 11), ri(40, 420), w === 0 ? (x.status === 'waiting' ? 'scheduled' : 'processing') : 'complete'])) };
    case 'domainhist': return { cols: ['run_id', 'started_at', 'finished_at', 'duration_h', 'captured_count', 'status'], rows: d.history.slice().reverse().map(h => [h.run, iso(h.date), iso(new Date(h.date.getTime() + h.duration * 36e5)), h.duration, h.captured, h.coverage < 90 ? 'low_count' : 'completed']) };
    case 'lowhist': return { cols: ['run_id', 'domain', 'client', 'started_at', 'coverage', 'jira_key'], rows: DOMAINS.flatMap(x => x.history.filter(h => h.coverage < 90).map(h => [h.run, x.domain, CLIENTS[x.client].name, iso(h.date), h.coverage, (x.tickets.find(t => Math.abs(t.created - h.date) < 6 * 864e5) || {}).id || null])).sort((a, b) => b[3].localeCompare(a[3])) };

  }
}

function gantt(list) {
  const t0 = new Date(2026, 9, 5).getTime(), t1 = new Date(2026, 9, 11).getTime();
  const lw = 190, w = 1100, rh = 26, top = 46; const iw = w - lw - 16;

    g += `<text x="10" y="${y + 17}" style="fill:var(--fg);font-size:11.5px">${d.domain}</text><text x="${lw - 8}" y="${y + 17}" text-anchor="end">${d.maint ? initials(P[d.maint].name) : '—'}</text>`;
    if (r.st === 'scheduled') g += `<rect x="${x(st)}" y="${y + 8}" width="${Math.max(3, x(endT) - x(st))}" height="10" rx="3" fill="none" stroke="var(--border-2)" stroke-dasharray="3 2"/>`;
    else {
      g += `<rect x="${x(st)}" y="${y + 8}" width="${Math.max(3, x(Math.min(doneT, endT)) - x(st))}" height="10" rx="3" fill="${r.st === 'delivered' ? 'var(--border-2)' : col}"/>`;
      if (!r.deliveredAt && endT > NOW.getTime()) g += `<rect x="${x(NOW.getTime()) + 1}" y="${y + 8}" width="${Math.max(2, x(endT) - x(NOW.getTime()) - 1)}" height="10" rx="3" fill="${col}" opacity=".28"/>`;

    const tip = `<b>${d.domain}</b><div>${CLIENTS[d.client].name} · ${d.maint ? P[d.maint].name : 'Unassigned'}</div><hr><div class='tr'><span>Due</span><b>${dueStr(r.due)}</b></div>${r.proj ? `<div class='tr'><span>Projected</span><b>${dueStr(r.proj)}</b></div>` : ''}${r.deliveredAt ? `<div class='tr'><span>Delivered</span><b>${dueStr(r.deliveredAt)}</b></div>` : ''}<div class='tr'><span>Status</span><b>${DST[r.st].label}</b></div>`;

const CITIES = { us: [['Austin', 'TX', '787'], ['Columbus', 'OH', '432'], ['Plano', 'TX', '750'], ['Tampa', 'FL', '336'], ['Denver', 'CO', '802'], ['Charlotte', 'NC', '282'], ['Phoenix', 'AZ', '850'], ['Indianapolis', 'IN', '462'], ['Raleigh', 'NC', '276'], ['Nashville', 'TN', '372']], uk: [['Leeds', 'WYK', 'LS1'], ['Bristol', 'BST', 'BS1'], ['Manchester', 'MAN', 'M1'], ['Glasgow', 'GLG', 'G1'], ['Cardiff', 'CRF', 'CF10']], eu: [['Berlin', 'BE', '101'], ['Hamburg', 'HH', '201'], ['Lyon', 'ARA', '690'], ['Milano', 'MI', '201'], ['Madrid', 'MD', '280']] };
const STREETS = ['Main St', 'Oak Ave', 'Market St', 'Lakeview Dr', 'Commerce Pkwy', 'Park Blvd', 'Highland Rd', 'River Rd', 'Station Way', 'Union Sq'];
const regionOf = d => /\.co\.uk|\.ie$|\/gb$|\/uk$|argos/.test(d.id) ? 'uk' : /\.(de|fr|it|es|nl)$|\/(de|fr)$/.test(d.id) ? 'eu' : 'us';

DOMAINS.forEach((d, i) => {
  const st = d.status;
  d.cfg = {
    bannerId: 114 + ((i * 397 + 53) % 3300), cadence: CADENCE[d.id] || 'Weekly',
    ident: `${d.id.replace(/[./]/g, '')}_${d.win.toLowerCase().replace('–', '-')}_${(CADENCE[d.id] || 'weekly').toLowerCase()}_${d.type.toLowerCase()} scrape`,
    firstBot: 1017 + ((i * 53) % 900), pdpBot: d.type === 'Full Site' ? 1058 + ((i * 71) % 800) : null, inputColl: d.type === 'Targeted' ? 1000 + ((i * 29) % 900) : null,
    platform: 'Mozenda ' + (2 + (i * 7) % 25), locked: LOCKED[d.id] || null,
    inputNr: d.type === 'Targeted' ? Math.round(d.baseline / (8 + (i % 5))) : d.type === 'Full Site' ? 1 : Math.round(d.baseline / 40),
    inputNrPrev: 0, appended: st === 'waiting' ? 'Pending' : LOCKED[d.id] ? 'Not appended: platform locked' : CADENCE[d.id] === 'Monthly' ? 'Skipped: monthly' : 'Inputs appended',
    requestIds: Array.from({ length: d.id === 'walmart.com' ? 4 : d.id === 'nike.com' ? 2 : 1 }, (_, k) => String(179338166403 + ((i * 7919 * 131 + k * 104729) % 998877665))),
    feas: { full: d.type === 'Full Site' || i % 3 !== 0, directed: true, category: i % 4 !== 1, maxStores3d: d.type === 'Full Site' ? 200 + (i * 37) % 800 : null },
    stores: d.type === 'Full Site' ? 180 + (i * 131) % 1400 : 40 + (i * 61) % 400,
  };
  const c = d.cfg; c.inputNrPrev = d.id === 'walmart.com' ? Math.round(c.inputNr * .88) : d.id === 'zalando.de' ? Math.round(c.inputNr * 1.06) : d.id === 'samsung.com/us' ? Math.round(c.inputNr * .97) : c.inputNr;
  c.lowStores = st === 'lowcount' ? Math.round(c.stores * (.06 + (i % 4) * .02)) : st === 'atrisk' ? Math.round(c.stores * .02) : 0;
  c.missStores = st === 'blocked' ? Math.round(c.stores * (d.id === 'macys.com' ? .9 : .38)) : st === 'failed' ? Math.round(c.stores * .06) : d.id === 'argos.co.uk' ? 9 : d.id === 'hm.com/en_us' ? 4 : st === 'lowcount' ? (i % 3) : 0;
});
TICKETS.forEach(t => { t.root = T_ROOT[t.id] || (t.reason === 'Low Count' ? 'count' : t.reason.includes('Sequence') ? 'blocked' : t.reason === 'Delayed Run' ? 'late' : t.reason === 'Input Generation' || t.reason === 'Missing Inputs' ? 'order' : 'count'); t.kind = t.reason === 'Low Count' ? 'Low count' : t.root === 'store' ? 'Missing store' : t.reason; });
function storeRows(d, kind) {
  const n = kind === 'low' ? d.cfg.lowStores : d.cfg.missStores; const cs = CITIES[regionOf(d)]; const out = [];
  for (let k = 0; k < Math.min(n, 40); k++) {
    const [city, stt, zip] = cs[(k * 3 + d.cfg.bannerId) % cs.length]; const exp = d.type === 'Targeted' ? 40 + ((k * 7 + d.cfg.bannerId) % 30) : 300 + ((k * 53) % 400);
    const cap = kind === 'low' ? Math.round(exp * (.55 + ((k * 13) % 30) / 100)) : 0;
    out.push({ d, storeId: 60000 + d.cfg.bannerId * 3 + k * 17, addr: `${100 + (k * 371) % 9800} ${STREETS[(k + d.cfg.bannerId) % STREETS.length]}`, city, state: stt, zip: zip + String(10 + k % 90).padStart(2, '0'), exp, cap, diff: cap - exp, kind });
  }
  return out;
}

/* ---------- Weekly requests ---------- */
SCREENS.requests = () => {
  const tab = F('rqTab', 'requests'), wk = +F('rqWeek', WEEK), q = F('rqQ', '').toLowerCase(), who_ = F('rqWho', 'all');
  const L = visibleDomains().filter(d => (who_ === 'all' || (who_ === 'none' ? !d.maint : d.maint === who_)) && (!q || (d.domain + d.cfg.ident + d.cfg.bannerId + CLIENTS[d.client].name + d.cfg.requestIds.join()).toLowerCase().includes(q)));
  const note = d => d.status === 'done' ? '<span class="chip done">Done</span>' : ACTIVE.includes(d.status) ? (ISSUE.includes(d.status) ? chip(d.status) : '<span class="chip info">Running</span>') : '<span class="chip idle">Queued</span>';
  const chips = `<div class="bar" style="gap:6px">${[['all', 'Everyone'], ...MAINT.map(m => [m, P[m].name.split(' ')[0]]), ['none', 'Not built / unassigned']].map(([k, l]) => `<button class="btn sm ${who_ === k ? 'primary' : ''}" data-ft="rqWho" data-v="${k}">${k !== 'all' && k !== 'none' ? av(k) : ''}${l}</button>`).join('')}</div>`;
  let body = '';
  if (tab === 'requests') {
    const rows = L.slice().sort((a, b) => a.domain.localeCompare(b.domain));
    body = `<div class="tw" style="max-height:640px;overflow:auto"><table class="t"><thead><tr><th>Status</th><th class="r">Banner ID</th><th>Domain</th><th>Window</th><th>Cadence</th><th>Type</th><th>Config</th><th class="r">Sequence</th><th>Mozenda account</th><th>Assignee</th><th class="r">Inputs</th><th>Input status</th><th>Crawl start</th><th>Delivery</th><th>Clients</th><th>Client request IDs</th><th>Low count ticket</th><th>Missing store ticket</th></tr></thead><tbody>
    ${rows.map(d => { const x = dlvOf(d); const lc = d.tickets.find(t => isOpen(t) && t.kind === 'Low count'); const ms = d.tickets.find(t => isOpen(t) && t.kind === 'Missing store'); return `<tr class="${d.status === 'done' ? 'quiet' : ''}" data-nav="domain" data-id="${d.id}"><td>${note(d)}</td><td class="r num">${d.cfg.bannerId}</td><td>${domLink(d.id)}</td><td>${d.win}</td><td>${d.cfg.cadence}</td><td>${d.type}</td><td class="mono" style="font-size:11.5px;max-width:280px;overflow:hidden;text-overflow:ellipsis" title="${d.cfg.ident}">${d.cfg.ident}</td><td class="r num">${d.status === 'waiting' ? '—' : d.seq.replace('MOZ-', '')}</td><td>${d.cfg.platform}${d.cfg.locked ? ` <span class="tag" data-tip="${d.cfg.locked}">${ic('lock', 'xs')}locked</span>` : ''}</td><td>${who(d.maint)}</td><td class="r num">${fmtN(d.cfg.inputNr)}</td><td class="${/Not|Skipped/.test(d.cfg.appended) ? '' : 'fg2'}" style="color:${/Not/.test(d.cfg.appended) ? 'var(--serious)' : ''}">${d.cfg.appended}</td><td class="fg2">${d.status === 'waiting' ? fmtD(d.nextStart) + ' 06:00' : fmtD(d.started) + ' ' + hm(d.started)}</td><td class="fg2">${x ? dueStr(x.due) : '—'}</td><td>${CLIENTS[d.client].name}</td><td class="mono" style="font-size:11.5px">${d.cfg.requestIds.length > 1 ? `${d.cfg.requestIds[0]} <span class="tag" data-tip="${d.cfg.requestIds.length} client requests deduplicated into one crawl">+${d.cfg.requestIds.length - 1}</span>` : d.cfg.requestIds[0]}</td><td>${lc ? tktLink(lc.id) : '<span class="muted">—</span>'}</td><td>${ms ? tktLink(ms.id) : '<span class="muted">—</span>'}</td></tr>`; }).join('')}</tbody></table></div><div class="tfoot"><span>${rows.length} configs · week ${wk}, ${2026}</span><button class="btn sm" data-act="csvx">${ic('download', 'sm')}Export CSV</button></div>`;
  } else if (tab === 'changes') {
    const added = [['zalando.it', 'Targeted', 'Wed–Fri', 'Weekly', null], ['currys.ie', 'Targeted', 'Thu–Sat', 'Monthly', null], ['walmart.com', 'Category', 'Mon–Wed', 'Weekly', 'marco']];
    const removed = [['macys.com', 'Targeted', 'Mon–Mon', 'Quarterly', 'priya'], ['bestbuy.com', 'Full Site', 'Sun–Mon', 'Biweekly', 'michael'], ['nike.com', 'Category', 'Wed–Mon', 'Monthly', 'sarah']];
    const row = (r, kind) => `<tr style="cursor:default;background:color-mix(in srgb,${kind === 'add' ? 'var(--ok-fill)' : 'var(--crit-fill)'} 7%,transparent)"><td><span class="chip ${kind === 'add' ? 'ok' : 'crit'}">${kind === 'add' ? 'Added' : 'Removed'}</span></td><td>${domLink(r[0])}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[1]}</td><td class="mono" style="font-size:11.5px">${r[0].replace(/[./]/g, '')}_${r[2].toLowerCase().replace('–', '-')}_${r[3].toLowerCase()}_${r[1].toLowerCase()} scrape</td><td>${who(r[4])}</td></tr>`;
    body = `<div class="card-b" style="padding:10px 14px;border-bottom:1px solid var(--border)"><span class="fg2">Comparing week ${PREV_WEEK} → ${WEEK}. Green rows are configs added this week, red rows dropped out since last week.</span></div><div class="tw"><table class="t"><thead><tr><th>Change</th><th>Domain</th><th>Window</th><th>Cadence</th><th>Type</th><th>Config</th><th>Assignee</th></tr></thead><tbody>${added.map(r => row(r, 'add')).join('')}${removed.map(r => row(r, 'rm')).join('')}</tbody></table></div>`;
  } else {
    const rows = L.map(d => ({ d, a: d.cfg.inputNrPrev, b: d.cfg.inputNr, diff: d.cfg.inputNr - d.cfg.inputNrPrev })).filter(r => r.d.type !== 'Full Site').sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
    body = `<div class="card-b" style="padding:10px 14px;border-bottom:1px solid var(--border)"><span class="fg2">Input counts per config, week ${PREV_WEEK} vs ${WEEK}. Large jumps usually mean the client changed its request, and the baseline may need a review.</span></div><div class="tw" style="max-height:600px;overflow:auto"><table class="t"><thead><tr><th>Domain</th><th>Config</th><th>Assignee</th><th class="r">Week ${PREV_WEEK} inputs</th><th class="r">Week ${WEEK} inputs</th><th class="r">Difference</th><th>Baseline</th></tr></thead><tbody>${rows.map(r => { const p = r.a ? r.diff / r.a * 100 : 0; const big = Math.abs(p) >= 5; return `<tr class="${big ? '' : 'quiet'}" data-nav="domain" data-id="${r.d.id}"><td>${domLink(r.d.id)}</td><td class="mono" style="font-size:11.5px">${r.d.cfg.ident}</td><td>${who(r.d.maint)}</td><td class="r num">${fmtN(r.a)}</td><td class="r num">${fmtN(r.b)}</td><td class="r num" style="font-weight:${big ? 600 : 400};color:${big ? (r.diff > 0 ? 'var(--ok)' : 'var(--crit)') : 'inherit'}">${r.diff > 0 ? '+' : ''}${fmtN(r.diff)}${r.diff ? ` (${p > 0 ? '+' : ''}${p.toFixed(1)}%)` : ''}</td><td>${big ? `<span class="chip warn">${ic('target')}Review baseline</span>` : '<span class="muted">—</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
  }
  const n = (f) => L.filter(f).length;
  return `${crumbs([['Operations'], ['Weekly Requests']])}<div class="ph"><div><h1>Weekly Requests</h1><p>Every crawl configuration requested this week, with its inputs, Mozenda account, client requests and tickets.</p></div><div class="ph-r"><span class="muted" style="font-size:12px">Year</span>${sel('rqYear', [['2026', '2026'], ['2025', '2025']], '2026', 'Year')}<span class="muted" style="font-size:12px">Week</span>${sel('rqWeek', Array.from({ length: 12 }, (_, k) => [String(WEEK - k), 'Week ' + (WEEK - k)]), String(WEEK), 'Week')}${searchBox('rqQ', 'Banner ID, domain, config, request ID…', 260)}</div></div>
  <div class="stats"><div><label>Configs this week</label><b>${L.length}</b></div><div><label>Running</label><b><i style="background:var(--info)"></i>${n(d => ACTIVE.includes(d.status))}</b></div><div><label>Done</label><b><i style="background:var(--muted)"></i>${n(d => d.status === 'done')}</b></div><div><label>Inputs not appended</label><b><i style="background:var(--serious-fill)"></i>${n(d => /Not/.test(d.cfg.appended))}</b></div><div><label>Client requests</label><b>${L.reduce((a, d) => a + d.cfg.requestIds.length, 0)}</b></div><div><label>Deduplicated</label><b>${L.reduce((a, d) => a + d.cfg.requestIds.length - 1, 0)}</b></div></div>
  <div class="card"><div class="card-h">${tabs('rqTab', [['requests', 'Requests', L.length], ['changes', 'Config changes vs last week', 6], ['inputs', 'Input changes']], 'requests')}</div><div class="card-b" style="padding:10px 14px;border-bottom:1px solid var(--border)">${chips}</div>${body}</div>`;
};

/* ---------- Store coverage (low counts + missing stores) ---------- */
SCREENS.stores = () => {
  const tab = F('scTab', 'low'), day = F('scDay', 'today'), q = F('scQ', '').toLowerCase();
  const L = visibleDomains();
  const rows = L.flatMap(d => storeRows(d, tab)).filter(r => !q || (r.d.domain + r.city + r.storeId + r.addr).toLowerCase().includes(q)).filter((r, k) => day === 'today' || k % 3 !== 0);
  const lowTot = L.reduce((a, d) => a + d.cfg.lowStores, 0), missTot = L.reduce((a, d) => a + d.cfg.missStores, 0), stTot = L.reduce((a, d) => a + d.cfg.stores, 0);
  const byDom = L.filter(d => (tab === 'low' ? d.cfg.lowStores : d.cfg.missStores) > 0).sort((a, b) => (tab === 'low' ? b.cfg.lowStores - a.cfg.lowStores : b.cfg.missStores - a.cfg.missStores));
  return `${crumbs([['Operations'], ['Store Coverage']])}<div class="ph"><div><h1>Store Coverage</h1><p>Low counts and missing stores at store level: which locations returned fewer products than expected, or none at all.</p></div><div class="ph-r">${tabs('scDay', [['today', 'Today'], ['yesterday', 'Yesterday']], 'today')}${searchBox('scQ', 'Domain, city, store ID…', 200)}</div></div>
  <div class="stats"><div><label>Stores requested</label><b>${fmtN(stTot)}</b></div><button data-ft="scTab" data-v="low"><label>Stores in low count</label><b><i style="background:var(--serious-fill)"></i>${lowTot}</b></button><button data-ft="scTab" data-v="miss"><label>Stores missing</label><b><i style="background:var(--crit-fill)"></i>${missTot}</b></button><div><label>Store coverage</label><b>${pct((stTot - missTot) / stTot * 100)}</b></div></div>
  <div class="grid g-main" style="grid-template-columns:minmax(0,1fr) 300px">
    <div class="card"><div class="card-h">${tabs('scTab', [['low', 'Low counts', lowTot], ['miss', 'Missing stores', missTot]], 'low')}<div class="r"><span class="sub">${rows.length} store rows shown</span><button class="btn sm" data-act="csvx">${ic('download', 'sm')}Export CSV</button></div></div>
      <div class="tw" style="max-height:620px;overflow:auto"><table class="t"><thead><tr><th>Domain</th><th class="r">Store ID</th><th>Address</th><th>City</th><th>State</th><th>Zip</th><th>Window</th><th>Assignee</th><th class="r">Expected</th><th class="r">Captured</th><th class="r">Difference</th><th>Ticket</th></tr></thead><tbody>
      ${rows.map(r => { const tk = r.d.tickets.find(isOpen); return `<tr data-nav="domain" data-id="${r.d.id}"><td>${domLink(r.d.id)}</td><td class="r num mono">${r.storeId}</td><td>${r.addr}</td><td>${r.city}</td><td>${r.state}</td><td class="mono">${r.zip}</td><td>${r.d.win}</td><td>${who(r.d.maint)}</td><td class="r num">${r.exp}</td><td class="r num">${r.cap}</td><td class="r num" style="color:var(--crit);font-weight:600">${r.diff}</td><td>${tk ? tktLink(tk.id) : '<span class="muted">—</span>'}</td></tr>`; }).join('') || '<tr><td colspan="12" class="empty">No stores in this state.</td></tr>'}</tbody></table></div></div>
    <div class="card" style="align-self:start"><div class="card-h"><h3>By domain</h3><span class="sub">${tab === 'low' ? 'stores in low count' : 'stores missing'}</span></div><div class="card-b">${hBars(byDom.map(d => ({ label: d.domain, value: tab === 'low' ? d.cfg.lowStores : d.cfg.missStores, nav: ['domain', d.id] })), { color: tab === 'low' ? 'var(--serious-fill)' : 'var(--crit-fill)' }) || '<span class="muted">None.</span>'}</div></div>
  </div>`;
};

/* ---------- Domain detail cards ---------- */

    <div class="kv"><div><label>Banner ID</label><b class="num">${c.bannerId}</b></div><div><label>Cadence</label><b>${c.cadence}</b></div><div><label>First bot config</label><b class="mono">${c.firstBot}</b></div><div><label>PDP bot config</label><b class="mono">${c.pdpBot || '—'}</b></div><div><label>Input collection</label><b class="mono">${c.inputColl || '—'}</b></div><div><label>Mozenda account</label><b>${c.platform}</b></div><div><label>Inputs</label><b class="num">${fmtN(c.inputNr)} <span class="muted" style="font-weight:400">(wk ${PREV_WEEK}: ${fmtN(c.inputNrPrev)})</span></b></div><div><label>Input status</label><b style="color:${/Not/.test(c.appended) ? 'var(--serious)' : 'inherit'}">${c.appended}</b></div></div>
    <div><div class="muted" style="font-size:11.5px;margin-bottom:4px">Config</div><div class="desc mono" style="font-size:11.5px;padding:8px 10px">${c.ident}</div></div>
    ${c.locked ? `<div class="banner serious" style="margin:0">${ic('lock')}<span>${c.locked}. Inputs are not appended automatically.</span></div>` : ''}
    <div><div class="muted" style="font-size:11.5px;margin-bottom:6px">Feasibility</div><div class="bar" style="gap:6px">${yn(f.full, 'Full book')}${yn(f.directed, 'Directed')}${yn(f.category, 'Category')}${f.maxStores3d ? `<span class="tag">Max ${f.maxStores3d} stores / 3 days</span>` : ''}</div></div>

    <div class="card-b" style="padding-bottom:8px"><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><div><label class="muted" style="font-size:11.5px;display:block">Covered</label><b class="num" style="font-size:17px">${pct((c.stores - c.missStores) / c.stores * 100)}</b></div><div><label class="muted" style="font-size:11.5px;display:block">Low count</label><b class="num" style="font-size:17px;color:${c.lowStores ? 'var(--serious)' : 'inherit'}">${c.lowStores}</b></div><div><label class="muted" style="font-size:11.5px;display:block">Missing</label><b class="num" style="font-size:17px;color:${c.missStores ? 'var(--crit)' : 'inherit'}">${c.missStores}</b></div></div></div>
    ${worst.length ? `<div class="tw"><table class="t"><thead><tr><th>Store</th><th>City</th><th class="r">Exp.</th><th class="r">Got</th><th class="r">Diff</th></tr></thead><tbody>${worst.map(r => `<tr style="cursor:default"><td class="mono">${r.storeId}</td><td>${r.city}, ${r.state}</td><td class="r num">${r.exp}</td><td class="r num">${r.cap}</td><td class="r num" style="color:var(--crit)">${r.diff}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card-b" style="padding-top:0"><span class="muted">All stores within expected counts.</span></div>'}</div>`;

/* ---------- Ticket templates ---------- */
const TEMPLATES = {
  late: { name: 'Expected late', col: 'In Progress', title: d => `Expected Late ${d.domain}`, body: d => { const x = dlvOf(d); return `- Banner / domain: ${CLIENTS[d.client].name} / ${d.domain}\n- Window affected: ${d.win}\n- Scrape type: ${d.type}\n- Reason for slow run / missed cut-off: ${d.note || 'describe the cause'}\n- Current progress: ${d.progress}%\n- New timeline: ${x && x.proj ? '100% expected ' + dueStr(x.proj) : 'add the expected completion'}`; } },
  blocked: { name: 'Blocked domain', col: 'Blocked Domains', title: d => `Blocked ${d.domain}_${d.type} Scrape`, body: d => `- What is happening: the site is blocking direct access to products (describe).\n- Crawl type affected: ${d.type} Scrape\n- Banner ID: ${d.cfg.bannerId}\n- Proxy pool: ${d.proxy.pool} (success ${pctR(d.proxy.success)})` },
  404: { name: '404 URLs', col: 'New Requests', title: d => `404 URLs ${d.cfg.ident}`, body: d => `- The attached file lists store IDs, SKUs and URLs that no longer resolve to a product and need to be updated or removed.\n- Attach: ${d.id.replace(/[./]/g, '_')}_404_week${WEEK}.csv` },
  rebuild: { name: 'Domain change / rebuild', col: 'New Requests', title: d => `Domain change/re-build ${d.domain}`, body: d => `- The domain structure (or API) changed and a new crawler is being built.\n- Estimated time until the new crawler is ready: XX days\n- Note if SKUs differ from the previous ones.` },
  sku: { name: 'Domain SKU update', col: 'New Requests', title: d => `Domain SKU update ${d.domain}`, body: d => `- The domain SKUs changed and no longer match the old ones.\n- Example product:\n  Old URL / SKU: …\n  New URL / SKU: …` },
};
function ticketModal(id, tpl = 'late') {
  const d = DM[id]; const t = TEMPLATES[tpl];
  openModal(`<div class="m-h"><h2>New Jira ticket</h2><p>${d.domain} · from a team template, prefilled from live data</p></div>
  <div class="m-b"><div class="field"><label>Template</label><div class="tabs">${Object.entries(TEMPLATES).map(([k, v]) => `<button class="${k === tpl ? 'on' : ''}" data-act="tpl" data-id="${id}|${k}">${v.name}</button>`).join('')}</div></div>
  <div class="field"><label for="tkt-title">Title</label><input class="input" id="tkt-title" value="${esc(t.title(d))}"></div>
  <div class="field"><label for="tkt-body">Description</label><textarea class="textarea mono" id="tkt-body" rows="8" style="font-size:12px">${esc(t.body(d))}</textarea></div>
  <div class="kv"><div><label>Board / column</label><b>E3BI · ${t.col}</b></div><div><label>Assignee</label><b>${who(d.maint, false)}</b></div><div><label>CC</label><b>${d.manager ? P[d.manager].name : 'Delivery manager'}, ${P[CLIENTS[d.client].csm].name}</b></div><div><label>Linked</label><b class="mono">${d.runId}</b></div></div></div>
  <div class="m-f"><span class="muted" style="font-size:11.5px;margin-right:auto">Prototype: nothing is sent to Jira</span><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="tktcreate" data-id="${id}">Create ticket</button></div>`);
}

/* ---------- Weekly ticket report (on Tickets page) ---------- */
function ticketReport() {
  const reqs = 38_000 + DOMAINS.reduce((a, d) => a + d.cfg.stores, 0);
  const open = TICKETS.filter(t => t.created >= new Date(2026, 9, 5) || isOpen(t));
  const causes = Object.keys(ROOT).filter(k => k !== 'ok').map(k => { const ts = open.filter(t => t.root === k); return { k, ts, n: ts.reduce((a, t) => a + Math.max(1, DM[t.domain].cfg.lowStores + DM[t.domain].cfg.missStores), 0), lc: ts.filter(t => t.kind === 'Low count').reduce((a, t) => a + DM[t.domain].cfg.lowStores, 0), ms: ts.reduce((a, t) => a + DM[t.domain].cfg.missStores, 0) }; }).filter(r => r.ts.length).sort((a, b) => b.n - a.n);
  const affected = causes.reduce((a, r) => a + r.n, 0);
  const rows = [{ k: 'ok', ts: [], n: reqs - affected, lc: 0, ms: 0 }, ...causes];
  const cl = Object.keys(CLIENTS).map(k => { const ds = DOMAINS.filter(d => d.client === k); const ts = open.filter(t => t.client === k); return { k, stores: ds.reduce((a, d) => a + d.cfg.stores, 0), mst: ts.filter(t => DM[t.domain].cfg.missStores).length, miss: ds.reduce((a, d) => a + d.cfg.missStores, 0), lct: ts.filter(t => t.kind === 'Low count').length, low: ds.reduce((a, d) => a + d.cfg.lowStores, 0) }; }).sort((a, b) => (b.miss + b.low) - (a.miss + a.low));
  return `<div class="stats"><div><label>Location requests (week ${WEEK})</label><b>${fmtN(reqs)}</b></div><div><label>Delivered on time, no ticket</label><b><i style="background:var(--ok-fill)"></i>${pct(rows[0].n / reqs * 100, 2)}</b></div><div><label>Requests with a ticket</label><b>${fmtN(affected)}</b></div><div><label>Tickets this week</label><b>${open.length}</b></div></div>
  <div class="grid g2"><div class="card"><div class="card-h"><h3>Root causes</h3><span class="sub">share of location requests, week ${WEEK}</span></div><div class="tw"><table class="t"><thead><tr><th>Root cause</th><th class="r">Requests</th><th class="r">%</th><th class="r">Low count stores</th><th class="r">Missing stores</th><th class="r">Tickets</th></tr></thead><tbody>${rows.map(r => `<tr class="${r.k === 'ok' ? 'quiet' : ''}" ${r.ts.length ? `data-act="rootf" data-id="${r.k}"` : 'style="cursor:default"'}><td>${r.k === 'ok' ? `<span class="chip ok">${ic('check')}On time</span> ` : ''}${ROOT[r.k]}</td><td class="r num">${fmtN(r.n)}</td><td class="r num">${pct(r.n / reqs * 100, 2)}</td><td class="r num">${r.lc}</td><td class="r num">${r.ms}</td><td class="r num">${r.ts.length || ''}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="card-h"><h3>Requests with a ticket, by root cause</h3></div><div class="card-b">${hBars(causes.map(r => ({ label: ROOT[r.k], value: r.n })), { color: 'var(--s2)' })}</div></div></div>
  <div class="card sec"><div class="card-h"><h3>Client summary</h3><span class="sub">stores affected this week · problems first</span></div><div class="tw"><table class="t"><thead><tr><th>Client</th><th class="r">Total stores</th><th class="r">Missing store tickets</th><th class="r">Stores missing</th><th class="r">Low count tickets</th><th class="r">Stores in low count</th></tr></thead><tbody>${cl.map(r => `<tr class="${r.miss + r.low ? '' : 'quiet'}" data-nav="client" data-id="${r.k}"><td>${CLIENTS[r.k].name}</td><td class="r num">${fmtN(r.stores)}</td><td class="r num">${r.mst || ''}</td><td class="r num" style="color:${r.miss ? 'var(--crit)' : ''}">${r.miss || ''}</td><td class="r num">${r.lct || ''}</td><td class="r num" style="color:${r.low ? 'var(--serious)' : ''}">${r.low || ''}</td></tr>`).join('')}</tbody></table></div></div>`;
}
const _tickets = SCREENS.tickets;
SCREENS.tickets = () => {
  const v = F('tkView', 'list'); const t = tabs('tkView', [['list', 'Tickets'], ['report', 'Weekly report']], 'list');
  if (v === 'list') return _tickets().replace('<div class="ph-r">', `<div class="ph-r">${t}`);
  return `${crumbs([['Workspace'], ['Tickets'], ['Weekly report']])}<div class="ph"><div><h1>Weekly ticket report</h1><p>Week ${WEEK}, 2026. Every location request either arrived on time or has a ticket with a root cause.</p></div><div class="ph-r">${t}${sel('tkWk', Array.from({ length: 8 }, (_, k) => [String(WEEK - k), 'Week ' + (WEEK - k)]), String(WEEK), 'Week')}<button class="btn" data-act="csvx">${ic('download', 'sm')}Export CSV</button></div></div>${ticketReport()}`;
};

Object.assign(ACT, {
  tkt: id => ticketModal(id, DM[id].status === 'blocked' ? 'blocked' : (dlvOf(DM[id]) || {}).st === 'atrisk' || (dlvOf(DM[id]) || {}).st === 'missing' ? 'late' : DM[id].status === 'blocked' ? 'blocked' : 'late'),
  tpl: v => { const [id, k] = v.split('|'); ticketModal(id, k); },
  tktcreate: id => { closeOverlays(); toast(`Jira ticket created for ${DM[id].domain} (simulated)`, 'ticket'); },
  storesfor: id => { S.f.scQ = id; S.f.scTab = DM[id].cfg.lowStores ? 'low' : 'miss'; go('stores'); },
  rootf: k => { Object.assign(S.f, { tkView: 'list', tkStatus: 'all', tkQ: '' }); S.f.tkRoot = k; rerender(); },
  csvx: () => toast('CSV export prepared (downloads are disabled in this prototype)', 'download'),
});

/* ================= BOOT ================= */
try { const t = localStorage.getItem('occ-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { }
render();

</script>

</body>
</html>
