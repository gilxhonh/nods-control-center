<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Nods Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>/* Layout: fixed left rail + sticky top bar + scrolling work area. Dense, hairline-bordered surfaces; status color carries meaning, accent stays for interaction. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f1f3f6; --hover:#eef1f5; --border:#e3e6eb; --border-2:#d3d8df;
  --fg:#0e1116; --fg-2:#465061; --muted:#7b8494; --accent:#2563c9; --accent-soft:#e7effb; --ring:#2563c9;
  --primary:#16191f; --primary-fg:#ffffff;
  --ok:#0b8a0b; --ok-fill:#0ca30c; --warn:#a86f00; --warn-fill:#fab219; --serious:#c2531f; --serious-fill:#ec835a; --crit:#c53030; --crit-fill:#d03b3b; --info:#2a78d6; --idle:#7b8494;
  --blk:#8e2453; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --grid:#e8eaee; --axis:#c3c8d0;
  --av-l:90%; --av-fg:28%; --shadow:0 8px 30px rgba(15,20,30,.12),0 1px 3px rgba(15,20,30,.08);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:8px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0c0f; --panel:#111418; --panel-2:#171a1f; --hover:#1c2026; --border:#22262d; --border-2:#2e333b;
  --fg:#edf0f4; --fg-2:#aab1bd; --muted:#7c8594; --accent:#6aa3f0; --accent-soft:#16243a; --ring:#6aa3f0;
  --primary:#edf0f4; --primary-fg:#0e1116;
  --ok:#3cc43c; --ok-fill:#0ca30c; --warn:#f5b73b; --warn-fill:#fab219; --serious:#f09469; --serious-fill:#ec835a; --crit:#f07070; --crit-fill:#d03b3b; --info:#3987e5; --idle:#7c8594;
  --blk:#e0709a; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#1f2329; --axis:#353a43;
  --av-l:22%; --av-fg:82%; --shadow:0 10px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0c0f; --panel:#111418; --panel-2:#171a1f; --hover:#1c2026; --border:#22262d; --border-2:#2e333b;
  --fg:#edf0f4; --fg-2:#aab1bd; --muted:#7c8594; --accent:#6aa3f0; --accent-soft:#16243a; --ring:#6aa3f0;
  --primary:#edf0f4; --primary-fg:#0e1116;
  --ok:#3cc43c; --ok-fill:#0ca30c; --warn:#f5b73b; --warn-fill:#fab219; --serious:#f09469; --serious-fill:#ec835a; --crit:#f07070; --crit-fill:#d03b3b; --info:#3987e5; --idle:#7c8594;
  --blk:#e0709a; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --grid:#1f2329; --axis:#353a43;
  --av-l:22%; --av-fg:82%; --shadow:0 10px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px;border-radius:4px}
.mono{font-family:var(--mono);font-size:.94em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .fg2{color:var(--fg-2)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:14px;height:14px} .ico.xs{width:12px;height:12px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center}
.brand-mark svg{width:15px;height:15px}
.brand b{font-weight:600;font-size:13px;display:block;line-height:1.2}
.brand span{font-size:11px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:8px 8px 12px}
.nav-g{margin-top:12px}
.nav-g:first-child{margin-top:4px}
.nav-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:4px 10px 4px;font-weight:500;display:flex;align-items:center;gap:6px}
.nav-h .pin{color:var(--accent);text-transform:none;letter-spacing:0;font-size:10.5px;margin-left:auto}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;padding:6px 10px;border:0;background:none;border-radius:6px;color:var(--fg-2);cursor:pointer;text-align:left;font-size:13px}
.nav-i:hover{background:var(--hover);color:var(--fg)}
.nav-i.on{background:var(--panel-2);color:var(--fg);font-weight:500;box-shadow:inset 0 0 0 1px var(--border)}
.nav-i.sub{padding-left:35px}
.nav-i .cnt{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.nav-i .cnt.hot{color:#fff;background:var(--crit-fill);border-radius:10px;padding:0 6px;font-weight:600}
.nav-i .cnt.warm{color:var(--serious);font-weight:600}
.pinned{background:var(--accent-soft);border-radius:8px;padding:4px;margin:4px 0 6px}
.pinned .nav-i{color:var(--fg)}
.pinned .nav-i.on{background:var(--panel)}
.me{border-top:1px solid var(--border);padding:10px;position:relative}
.me-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;text-align:left}
.me-btn:hover{background:var(--hover)}
.me-btn b{display:block;font-weight:500;font-size:13px}
.me-btn span{font-size:11.5px;color:var(--muted)}
.me-btn .ico{margin-left:auto;color:var(--muted)}

.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:20}
.burger{display:none}
.search{position:relative;flex:1 1 auto;max-width:440px;min-width:120px}
.search input{width:100%;height:32px;border:1px solid var(--border);background:var(--panel-2);border-radius:7px;padding:0 54px 0 32px;outline:none}
.search input:focus{border-color:var(--ring);background:var(--panel)}
.search>.ico{position:absolute;left:10px;top:8px;color:var(--muted)}
.search .kbd{position:absolute;right:8px;top:7px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border-2);border-radius:4px;padding:0 5px;color:var(--muted);background:var(--panel)}
.sres{position:absolute;top:38px;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:420px;overflow:auto;padding:6px;z-index:50}
.sres h6{margin:6px 8px 4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.sres button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:left}
.sres button:hover,.sres button.sel{background:var(--hover)}
.sres small{margin-left:auto;color:var(--muted);font-size:11.5px}
.top-sp{display:none}
.live{margin-left:auto}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);padding:0 10px;height:30px;border:1px solid var(--border);border-radius:7px;cursor:pointer;background:var(--panel)}
.live:hover{background:var(--hover)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok-fill);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok-fill) 60%,transparent);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live b{font-weight:600;color:var(--fg)} .live .sep{width:1px;height:14px;background:var(--border)}
.live .bad{color:var(--crit);font-weight:600}
.win{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px;padding:0 4px}
.icon-btn{position:relative;width:32px;height:32px;border:1px solid transparent;background:none;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--fg-2)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn .dot{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--crit-fill);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 3px;border:2px solid var(--panel)}
.rolesel{display:flex;align-items:center;gap:6px;height:30px;border:1px dashed var(--border-2);border-radius:7px;padding:0 4px 0 9px;font-size:12px;color:var(--muted)}
.rolesel select{border:0;background:transparent;font-weight:500;color:var(--fg);padding:2px 2px;cursor:pointer;outline:none}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.page{padding-block:18px 48px;padding-inline:24px;max-width:1560px;margin:0 auto}

/* ---------- page header ---------- */
.crumbs{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer}
.crumbs button:hover{color:var(--fg)}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.015em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-wrap:balance}
.ph p{margin:3px 0 0;color:var(--fg-2)}
.ph-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border);border-radius:var(--r);background:var(--panel);margin-bottom:16px}
.meta>div{padding:10px 16px;border-right:1px solid var(--border);min-width:0}
.meta>div:last-child{border-right:0}
.meta label{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.meta b{font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--border-2);background:var(--panel);border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.primary:hover{opacity:.9}
.btn.danger{background:var(--crit-fill);border-color:var(--crit-fill);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .ico{width:14px;height:14px}
.spin{animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.input,.select,.textarea{height:30px;border:1px solid var(--border-2);background:var(--panel);border-radius:7px;padding:0 10px;outline:none;font-size:12.5px;min-width:0}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 18%,transparent)}
.select{padding-right:6px;cursor:pointer}
.textarea{height:auto;padding:8px 10px;resize:vertical;width:100%;min-height:72px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:500}
.field .hint{font-size:11.5px;color:var(--muted)}
.inwrap{position:relative;display:flex;align-items:center}
.inwrap .ico{position:absolute;left:9px;color:var(--muted)}
.inwrap .input{padding-left:30px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:3px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--fg-2);display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.06),0 0 0 1px var(--border);font-weight:500}
.tabs .c{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;color:var(--fg-2)}
.toggle{width:30px;height:18px;border-radius:10px;background:var(--border-2);position:relative;border:0;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle.on{background:var(--accent)} .toggle.on::after{left:14px}

/* ---------- surfaces ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);min-height:44px;flex-wrap:wrap}
.card-h h3{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .sub{color:var(--muted);font-size:12px}
.card-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.card-b{padding:14px}
.card-b.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
.g-main2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{margin-top:14px}
.link{color:var(--accent);cursor:pointer;background:none;border:0;padding:0;font:inherit}
.link:hover{text-decoration:underline}
.ent{cursor:pointer;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.ent:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px 10px;cursor:pointer;text-align:left;position:relative;transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--border-2);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.kpi.on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.kpi .l{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.kpi .d{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;justify-content:space-between}
.kpi .sw{width:8px;height:8px;border-radius:2px}
.kpi.static{cursor:default}
.up-bad{color:var(--crit)} .down-good{color:var(--ok)} .up-good{color:var(--ok)} .down-bad{color:var(--crit)}

/* Status chip */
.chip{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 7px 0 6px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.chip .ico{width:12px;height:12px;stroke-width:2.4}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok-fill) 11%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn-fill) 17%,transparent)}
.chip.serious{color:var(--serious);background:color-mix(in srgb,var(--serious-fill) 15%,transparent)}
.chip.crit{color:var(--crit);background:color-mix(in srgb,var(--crit-fill) 13%,transparent)}
.chip.done{color:var(--fg-2);background:var(--panel-2);border-color:var(--border)}
.chip.idle{color:var(--muted);background:transparent;border-color:var(--border-2);border-style:dashed}
.chip.info{color:var(--info);background:color-mix(in srgb,var(--info) 12%,transparent)}
.chip.lg{height:24px;font-size:11.5px;padding:0 9px 0 7px}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;font-size:11.5px;background:var(--panel-2);border:1px solid var(--border);color:var(--fg-2);white-space:nowrap}
.tag.p1{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent);background:color-mix(in srgb,var(--crit-fill) 8%,transparent);font-weight:600}
.tag.p2{color:var(--serious);border-color:color-mix(in srgb,var(--serious) 30%,transparent);font-weight:600}
.tag.p3{color:var(--fg-2)}
.tkt{font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer;background:none;border:0;padding:0;white-space:nowrap}
.tkt:hover{text-decoration:underline}
.sev{width:3px;align-self:stretch;border-radius:2px;flex:none}
.sev.crit{background:var(--crit-fill)} .sev.serious{background:var(--serious-fill)} .sev.warn{background:var(--warn-fill)} .sev.ok{background:var(--ok-fill)} .sev.idle{background:var(--border-2)}

/* Avatar */
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:600;flex:none;background:hsl(var(--h) 45% var(--av-l));color:hsl(var(--h) 45% var(--av-fg));letter-spacing:.02em}
.av.md{width:28px;height:28px;font-size:11px}
.av.lg{width:40px;height:40px;font-size:14px}
.who{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}

/* Progress + meters */
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog .t{flex:1;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border);min-width:50px}
.prog .f{height:100%;border-radius:3px;background:var(--fg-2)}
.prog .p{font-size:12px;font-variant-numeric:tabular-nums;width:34px;text-align:right;color:var(--fg-2)}
.f.ok{background:var(--ok-fill)} .f.warn{background:var(--warn-fill)} .f.serious{background:var(--serious-fill)} .f.crit{background:var(--crit-fill)} .f.done{background:var(--muted)} .f.idle{background:var(--border-2)} .f.info{background:var(--info)}
.cov{display:flex;flex-direction:column;gap:3px;min-width:78px}
.cov .v{font-variant-numeric:tabular-nums;font-weight:500}
.cov .v.bad{color:var(--crit)} .cov .v.mid{color:var(--serious)}
.cov .t{height:4px;background:var(--panel-2);border-radius:2px;position:relative;box-shadow:inset 0 0 0 1px var(--border)}
.cov .t i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.cov .t b{position:absolute;left:90%;top:-2px;bottom:-2px;width:1.5px;background:var(--fg-2)}
.bigmeter{margin-top:6px}
.bigmeter .t{height:12px;background:var(--panel-2);border-radius:6px;position:relative;box-shadow:inset 0 0 0 1px var(--border)}
.bigmeter .t i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bigmeter .t .th{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}
.bigmeter .t .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.7}
.bigmeter .lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;position:relative;height:14px}
.bigmeter .lbls span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* Health strip */
.health{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:0}
.health>div{padding:16px 18px;min-width:0}
.health>div+div{border-left:1px solid var(--border)}
.hero-n{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.hero-n small{font-size:16px;color:var(--muted);font-weight:500;margin-left:2px}
.segbar{display:flex;gap:2px;height:14px;margin:4px 0 12px}
.segbar>button{border:0;padding:0;cursor:pointer;height:100%;min-width:4px}
.segbar>button:first-child{border-radius:4px 0 0 4px} .segbar>button:last-child{border-radius:0 4px 4px 0}
.segbar>button:hover{filter:brightness(1.08);outline:2px solid var(--fg);outline-offset:1px}
.seglg{display:flex;gap:18px;flex-wrap:wrap}
.seglg button{border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:baseline;gap:7px;text-align:left}
.seglg button:hover b{text-decoration:underline}
.seglg i{width:9px;height:9px;border-radius:2px;display:inline-block;align-self:center}
.seglg b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.seglg span{color:var(--fg-2);font-size:12px}

/* Tables */
.tw{overflow-x:auto;min-width:0}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
.t th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:500;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:11.5px;z-index:1}
.t th.r,.t td.r{text-align:right}
.t td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t tbody tr{cursor:pointer}
.t tbody tr:hover td{background:var(--hover)}
.t tr.quiet td{color:var(--fg-2)}
.t tr.quiet .dn{font-weight:400}
.t .dn{font-weight:500}
.t .sub{font-size:11px;color:var(--muted);display:block;font-family:var(--mono)}
.t td.sevc{padding:0;width:3px}
.t td.sevc i{display:block;width:3px;height:34px}
.sortable{cursor:pointer;user-select:none} .sortable:hover{color:var(--fg)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}

/* Attention list */
.att{display:flex;flex-direction:column}
.att-r{display:grid;grid-template-columns:3px 28px minmax(0,1.3fr) minmax(0,1.7fr) 150px 92px;gap:12px;align-items:center;padding:10px 14px 10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.att-r:last-child{border-bottom:0}
.att-r:hover{background:var(--hover)}
.att-r .ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.att-r .ic.crit{background:color-mix(in srgb,var(--crit-fill) 12%,transparent);color:var(--crit)}
.att-r .ic.serious{background:color-mix(in srgb,var(--serious-fill) 14%,transparent);color:var(--serious)}
.att-r .ic.warn{background:color-mix(in srgb,var(--warn-fill) 16%,transparent);color:var(--warn)}
.att-r .ic.idle{background:var(--panel-2);color:var(--muted)}
.att-r .d1 b{font-weight:600;display:block}
.att-r .d1 span{font-size:12px;color:var(--muted)}
.att-r .d2{font-size:12.5px;color:var(--fg-2);min-width:0}
.att-r .d2 .why{color:var(--fg);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-r .d4{text-align:right}

/* Lists */
.li{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li .grow{flex:1;min-width:0}
.li .grow>b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow>span{font-size:11.5px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.load:last-child{border-bottom:0}
.load:hover{background:var(--hover)}
.load .nm{width:118px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load .stk{flex:1;display:flex;gap:2px;height:8px;min-width:40px}
.load .stk i{height:100%;display:block}
.load .stk i:first-child{border-radius:3px 0 0 3px}.load .stk i:last-child{border-radius:0 3px 3px 0}
.load .n{font-size:11.5px;color:var(--muted);width:64px;text-align:right;font-variant-numeric:tabular-nums}
.lvl{font-size:11px;font-weight:600;min-width:52px;text-align:right;white-space:nowrap}
.lvl.High{color:var(--crit)} .lvl.Elevated{color:var(--serious)} .lvl.Normal{color:var(--muted)} .lvl.Light{color:var(--muted)}

/* Timeline */
.tl{position:relative;padding:4px 0 0}
.tl-i{display:grid;grid-template-columns:44px 14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.tl-i .tm{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;padding-top:1px}
.tl-i .dt{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--panel);box-shadow:0 0 0 2px var(--border-2);position:relative;z-index:1}
.tl-i:not(:last-child)::after{content:"";position:absolute;left:62px;top:16px;bottom:0;width:1.5px;background:var(--border)}
.tl-i .dt.ok{background:var(--ok-fill);box-shadow:0 0 0 2px var(--panel)} .tl-i .dt.crit{background:var(--crit-fill);box-shadow:0 0 0 2px var(--panel)}
.tl-i .dt.serious{background:var(--serious-fill);box-shadow:0 0 0 2px var(--panel)} .tl-i .dt.warn{background:var(--warn-fill);box-shadow:0 0 0 2px var(--panel)}
.tl-i .dt.info{background:var(--info);box-shadow:0 0 0 2px var(--panel)} .tl-i .dt.pend{background:var(--panel);box-shadow:0 0 0 2px var(--border-2)}
.tl-i b{font-weight:500;display:block}
.tl-i span{font-size:12px;color:var(--muted)}
.tl-i.pend b{color:var(--muted);font-weight:400}

/* Pipeline */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;padding:4px 0}
.st{position:relative;padding:0 8px;text-align:center}
.st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border-2);z-index:0}
.st:first-child::before{display:none}
.st.ok::before,.st.run::before,.st.trig::before{background:var(--ok-fill)}
.st .c{width:28px;height:28px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;position:relative;z-index:1;background:var(--panel);border:2px solid var(--border-2);color:var(--muted)}
.st.ok .c{background:var(--ok-fill);border-color:var(--ok-fill);color:#fff}
.st.run .c{border-color:var(--info);color:var(--info);background:var(--panel)}
.st.trig .c{border-color:var(--serious-fill);background:var(--serious-fill);color:#fff}
.st.fail .c{border-color:var(--crit-fill);background:var(--crit-fill);color:#fff}
.st b{display:block;font-weight:500;font-size:12px}
.st span{font-size:11px;color:var(--muted)}

/* Segments (Mozenda sequences) */
.segs .sg{display:grid;grid-template-columns:minmax(0,1fr) 90px 64px;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--border);font-size:12.5px}
.segs .sg:last-child{border-bottom:0}
.segs .sg .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
.segs .sg .bx{width:7px;height:7px;border-radius:2px;flex:none}

/* Slack */
.msg{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.msg:last-child{border-bottom:0}
.msg b{font-weight:600;font-size:12.5px}
.msg .tm{font-size:11px;color:var(--muted);margin-left:6px}
.msg p{margin:2px 0 0;color:var(--fg)}
.msg .bot{font-size:10px;border:1px solid var(--border-2);border-radius:3px;padding:0 4px;color:var(--muted);margin-left:5px}
.chan{font-family:var(--mono);font-size:12px;color:var(--fg-2)}

/* Banner */
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);font-size:12.5px;margin-bottom:12px;border:1px solid}
.banner.crit{border-color:color-mix(in srgb,var(--crit-fill) 35%,transparent);background:color-mix(in srgb,var(--crit-fill) 7%,var(--panel));color:var(--fg)}
.banner.crit .ico{color:var(--crit)}
.banner.serious{border-color:color-mix(in srgb,var(--serious-fill) 40%,transparent);background:color-mix(in srgb,var(--serious-fill) 8%,var(--panel))}
.banner.serious .ico{color:var(--serious)}
.banner.info{border-color:color-mix(in srgb,var(--accent) 30%,transparent);background:var(--accent-soft)}
.banner.info .ico{color:var(--accent)}
.banner .r{margin-left:auto;display:flex;gap:6px}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border:1px solid var(--border);border-radius:var(--r);background:var(--panel);margin-bottom:14px;overflow:hidden}
.stats>*{padding:11px 16px;border-right:1px solid var(--border);text-align:left;background:none;border-top:0;border-bottom:0;border-left:0;min-width:0}
.stats>*:last-child{border-right:0}
.stats button{cursor:pointer} .stats button:hover{background:var(--hover)}
.stats label{display:block;font-size:12px;color:var(--fg-2);cursor:inherit}
.stats b{font-size:21px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.stats b i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* Charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.chart .thr{stroke:var(--crit-fill);stroke-width:1.5;stroke-dasharray:4 3}
.chart .thr-l{fill:var(--crit);font-weight:500}
.chart .hit rect{fill:transparent}
.chart .hit .xh{stroke:var(--fg-2);stroke-width:1;opacity:0}
.chart .hit:hover .xh{opacity:.35}
.chart .hit:hover rect.hb{fill:var(--fg);fill-opacity:.04}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-bottom:8px}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg i.ln{height:2px;border-radius:1px;width:14px}
.lg i.dsh{height:0;border-top:1.5px dashed var(--crit-fill);width:14px;border-radius:0}
.hb-row{display:grid;grid-template-columns:120px minmax(0,1fr) 54px;gap:10px;align-items:center;padding:4px 0;font-size:12.5px;cursor:default}
.hb-row .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-2)}
.hb-row.click{cursor:pointer} .hb-row.click:hover .lb{color:var(--accent)}
.hb-row .tr{height:10px;display:flex;gap:2px}
.hb-row .tr i{height:100%;display:block}
.hb-row .tr i:last-child{border-radius:0 4px 4px 0}
.hb-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.an-k{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.an-k b{font-size:22px;font-weight:600;letter-spacing:-.02em}
.an-k span{font-size:12px}

/* Tooltip */
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--primary);color:var(--primary-fg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;box-shadow:var(--shadow);opacity:0;transition:opacity .08s;line-height:1.4}
#tip.on{opacity:1}
#tip .tr{display:flex;gap:8px;align-items:center;justify-content:space-between}
#tip i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}
#tip hr{border:0;border-top:1px solid color-mix(in srgb,var(--primary-fg) 20%,transparent);margin:4px 0}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:90;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);border-left:1px solid var(--border);z-index:100;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(24px);opacity:0}}
.dr-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.dr-h h2{margin:0;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dr-h p{margin:3px 0 0;color:var(--fg-2);font-size:12.5px}
.dr-h .x{margin-left:auto}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px}
.dr-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.dr-sec{margin-bottom:18px}
.dr-sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.kv>div{padding:8px 12px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-width:0}
.kv>div:nth-child(2n){border-right:0}
.kv label{display:block;font-size:11px;color:var(--muted)}
.kv b{font-weight:500;display:flex;gap:6px;align-items:center;overflow:hidden;text-overflow:ellipsis}
.desc{background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:12.5px;line-height:1.55;white-space:pre-wrap}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;z-index:100;box-shadow:var(--shadow);animation:mi .16s ease-out}
@keyframes mi{from{opacity:0;transform:translate(-50%,-48%)}}
.modal .m-h{padding:16px 18px 4px}
.modal .m-h h2{margin:0;font-size:16px;font-weight:600}
.modal .m-h p{margin:4px 0 0;color:var(--fg-2);font-size:12.5px}
.modal .m-b{padding:14px 18px}
.modal .m-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:12px}
.cmp label{font-size:11px;color:var(--muted);display:block}
.cmp b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.pop{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);z-index:60}
.notif{right:12px;top:46px;width:380px}
.notif .nh{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.notif .nh b{font-weight:600}
.notif .ni{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
.notif .ni:hover{background:var(--hover)}
.notif .ni .u{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:7px;flex:none}
.notif .ni .u.r{background:transparent}
.notif .ni b{font-weight:500;display:block}
.notif .ni span{font-size:12px;color:var(--muted)}
.menu{bottom:62px;left:10px;right:10px;padding:6px}
.menu h6{margin:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.menu button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer;text-align:left;font-size:12.5px}
.menu button:hover{background:var(--hover)}
.menu button .ck{margin-left:auto;color:var(--accent)}
.menu button small{display:block;color:var(--muted);font-size:11px}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.toasts{position:fixed;bottom:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--primary);color:var(--primary-fg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:12.5px;display:flex;gap:8px;align-items:center;animation:mi2 .2s ease-out;max-width:380px}
@keyframes mi2{from{opacity:0;transform:translateY(8px)}}
.proto{font-size:10.5px;border:1px solid var(--border-2);color:var(--muted);border-radius:4px;padding:1px 5px;white-space:nowrap}

/* Explorer */
.ex{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
.q-i{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;text-align:left}
.q-i:hover{background:var(--hover)}
.q-i.on{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--border)}
.q-i b{font-weight:500;font-size:12.5px}
.q-i span{font-size:11.5px;color:var(--muted)}
.editor{display:grid;grid-template-columns:38px minmax(0,1fr);background:var(--panel-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12.5px;line-height:1.65}
.editor .ln{color:var(--muted);text-align:right;padding:10px 8px 10px 0;user-select:none;border-right:1px solid var(--border);white-space:pre}
.editor textarea{border:0;background:transparent;resize:vertical;outline:none;padding:10px 12px;min-height:190px;font:inherit;line-height:inherit;color:var(--fg);white-space:pre;overflow:auto;width:100%}
.ro{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ok);background:color-mix(in srgb,var(--ok-fill) 11%,transparent)}
.params{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;align-items:center}
.params label{font-size:12px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.err{padding:14px;color:var(--crit);display:flex;gap:8px;align-items:flex-start}

/* Integrations */
.ints{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.int{padding:14px;display:flex;flex-direction:column;gap:12px}
.int-h{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none;letter-spacing:-.02em}
.int-h b{font-weight:600;font-size:14px;display:block}
.int-h span{font-size:12px;color:var(--muted)}
.int dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:12.5px}
.int dt{color:var(--muted)} .int dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.minis{display:flex;gap:2px;align-items:flex-end;height:26px}
.minis i{flex:1;background:var(--ok-fill);opacity:.75;border-radius:1px;min-width:2px}
.minis i.e{background:var(--crit-fill);opacity:1}
.minis i.w{background:var(--warn-fill);opacity:1}

/* Assignments */
.asg{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px}
.mem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.mem:hover{background:var(--hover)}
.mem.on{background:var(--accent-soft)}
.mem .grow{flex:1;min-width:0}
.mem .grow b{font-weight:500;display:block}
.mem .grow span{font-size:11.5px;color:var(--muted)}
.cap{width:60px;height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border)}
.cap i{display:block;height:100%}

.settings .row{display:flex;align-items:center;gap:16px;padding:14px;border-bottom:1px solid var(--border)}
.settings .row:last-child{border-bottom:0}
.settings .row .grow{flex:1}
.settings .row b{font-weight:500;display:block}
.settings .row span{font-size:12px;color:var(--muted)}

.skel{background:linear-gradient(90deg,var(--panel-2),var(--hover),var(--panel-2));background-size:200% 100%;animation:sk 1.1s infinite;border-radius:4px;height:12px}
@keyframes sk{to{background-position:-200% 0}}
.fade{animation:fi .25s}

@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .health{grid-template-columns:200px minmax(0,1fr)}
  .health>div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}
  .ints{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main{grid-template-columns:minmax(0,1fr) 300px}
  .att-r{grid-template-columns:3px 28px minmax(0,1.2fr) minmax(0,1.5fr) 92px}
  .att-r .d3{display:none}
}
@media (max-width:1000px){
  .g-main,.g-main2,.g2,.g3,.ex,.asg{grid-template-columns:minmax(0,1fr)}
  .health{grid-template-columns:minmax(0,1fr)}
  .health>div+div{border-left:0;border-top:1px solid var(--border)}
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px}
  .st:nth-child(5)::before{display:none}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:256px;z-index:120;transform:translateX(-100%);transition:transform .2s}

function niceTicks(min, max) { const r = max - min; const step = [1, 2, 2.5, 5, 10, 20, 25, 50, 100, 200, 500].find(s => r / s <= 5) || r / 4; const out = []; for (let v = Math.ceil(min / step) * step; v <= max + 1e-9; v += step) out.push(+v.toFixed(2)); return out; }

    if (area && series.length === 1) g += `<path d="M${pts.map(p => p.join(',')).join('L')}L${x(s.values.length - 1)},${y(yMin)}L${x(0)},${y(yMin)}Z" fill="${s.color}" fill-opacity=".1"/>`;

}
function stackCols({ labels, series, h = 200, w = 640, tipLabel, yMax }) {
  const pl = 30, pr = 8, pt = 10, pb = 24; const iw = w - pl - pr, ih = h - pt - pb;
  const tot = labels.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));

function searchResults() {

const SCREENS = {};
function go(name, id = null, push = true) {
  if (push) S.hist.push({ ...S.route });

  $('#side').classList.remove('open');
  render(); $('#main').scrollTop = 0;
}
function goKey(k) {
  const base = routeOfKey(k);

  if (k === 'tickets:mine') Object.assign(S.f, { tkMaint: 'sarah', tkStatus: 'open', tkClient: 'all' });
  else if (k === 'tickets:clients') Object.assign(S.f, { tkClient: 'csm:olivia', tkStatus: 'open', tkMaint: 'all' });
  else if (base === 'tickets') Object.assign(S.f, { tkMaint: 'all', tkClient: 'all' });
  if (k === 'deliveries:mine') Object.assign(S.f, { dvM: 'sarah', dvCl: 'all' }); else if (k === 'deliveries:clients') Object.assign(S.f, { dvM: 'all', dvCl: 'csm:olivia' }); else if (base === 'deliveries') Object.assign(S.f, { dvM: S.role === 'maintainer' ? 'sarah' : 'all', dvCl: S.role === 'csm' ? 'csm:olivia' : 'all' });
  if (k === 'clients:mine') S.f.clCsm = 'olivia'; else if (base === 'clients') S.f.clCsm = 'all';
  go(base);
}
function render(keep) {
  const m = $('#main'); const st = m.scrollTop;
  const ae = document.activeElement; const aid = ae && ae.id; const sel = ae && ae.selectionStart;

  if (keep) m.scrollTop = st;
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) { } } }
}
const rerender = () => render(true);
function crumbs(items) {

function sel(key, opts, def, label) { return `<select class="select" id="f-${key}" data-f="${key}" aria-label="${label}">${opts.map(([v, l]) => `<option value="${v}" ${String(F(key, def)) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`; }
function searchBox(key, ph, w = 220) { return `<div class="inwrap" style="width:${w}px;max-width:100%">${ic('search', 'sm')}<input class="input" style="width:100%" id="f-${key}" data-f="${key}" placeholder="${ph}" value="${esc(F(key, ''))}"></div>`; }
function tabs(key, items, def) { return `<div class="tabs" role="tablist">${items.map(([v, l, c]) => `<button role="tab" data-ft="${key}" data-v="${v}" class="${F(key, def) === v ? 'on' : ''}">${l}${c != null ? `<span class="c">${c}</span>` : ''}</button>`).join('')}</div>`; }
function stMatch(d, f) {
  switch (f) {
    case 'all': return true; case 'active': return ACTIVE.includes(d.status);
    case 'risk': return ['atrisk', 'delayed'].includes(d.status); case 'issues': return ISSUE.includes(d.status);

const clientOpts = () => [['all', 'All clients'], ...Object.entries(CLIENTS).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([k, c]) => [k, c.name])];

const typeOpts = [['all', 'All types'], ['Full Site', 'Full Site'], ['Targeted', 'Targeted'], ['Category', 'Category'], ['Search Pages', 'Search Pages']];
const winOpts = [['all', 'All windows'], ...['Mon–Wed', 'Mon–Thu', 'Tue–Thu', 'Tue–Fri', 'Wed–Fri', 'Thu–Sat'].map(w => [w, w])];
const sortDom = (a, b) => ST[a.status].rank - ST[b.status].rank || cov(a) - cov(b);

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-nav],[data-go],[data-ft]');
  if (!el) { if (S.pop && !e.target.closest('.pop,.search')) { S.pop = null; renderSide(); renderTop(); } return; }
  if (el.dataset.ft) { S.f[el.dataset.ft] = el.dataset.v; rerender(); return; }
  if (el.dataset.go) { e.preventDefault(); goKey(el.dataset.go); return; }
  if (el.dataset.nav) { e.preventDefault(); go(el.dataset.nav, el.dataset.id); return; }
  const a = ACT[el.dataset.act]; if (a) { e.preventDefault(); a(el.dataset.id, el, e); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'gsearch') { S.q = t.value; S.pop = 'search'; renderTop(); const g = $('#gsearch'); g.focus(); g.setSelectionRange(g.value.length, g.value.length); return; }
  if (t.dataset.f && t.tagName === 'INPUT' && t.type !== 'checkbox') { S.f[t.dataset.f] = t.value; rerender(); }
  if (t.dataset.m) { const v = t.type === 'checkbox' ? t.checked : t.value; S.f[t.dataset.m] = v; const h = ACT['m-' + t.dataset.m]; h && h(v); }
});
document.addEventListener('change', e => {

  if (t.id === 'rolesel') { ACT.role(t.value); return; }
  if (t.dataset.f && t.tagName === 'SELECT') { S.f[t.dataset.f] = t.value; if (['exDom', 'exCli'].includes(t.dataset.f)) { S.f.exSql = null; S.f.exRes = null; } rerender(); }
  if (t.dataset.m && (t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT')) { S.f[t.dataset.m] = t.type === 'checkbox' ? t.checked : t.value; const h = ACT['m-' + t.dataset.m]; h && h(S.f[t.dataset.m]); }
});
document.addEventListener('focusin', e => { if (e.target.id === 'gsearch' && S.pop !== 'search') { S.pop = 'search'; renderTop(); const g = $('#gsearch'); g.focus(); } });
document.addEventListener('keydown', e => {

function alertList() {
  const out = [];
  DOMAINS.filter(d => ISSUE.includes(d.status)).forEach(d => {
    const tk = d.tickets.find(isOpen);
    out.push({ id: 'run-' + d.id, sev: ST[d.status].tone, icon: ST[d.status].icon, kind: ST[d.status].label, d, title: d.domain, why: d.note, ticket: tk, at: tk ? tk.created : new Date(NOW - 50 * 60000) });
  });
  DOMAINS.filter(d => !d.maint).forEach(d => out.push({ id: 'un-' + d.id, sev: 'idle', icon: 'user', kind: 'Unassigned', d, title: d.domain, why: `No delivery engineer. First run window ${fmtD(d.nextStart)}.`, at: new Date(2026, 9, 1, 10, 30), ticket: d.tickets.find(isOpen) }));
  out.push({ id: 'ba-walmart', sev: 'warn', icon: 'target', kind: 'Baseline anomaly', d: DM['walmart.com'], title: 'walmart.com', why: 'Last 3 runs 11–14% above baseline. Baseline may be stale.', at: new Date(2026, 9, 5, 15, 4), ticket: TM['JIRA-4797'] });
  DOMAINS.filter(d => d.history.filter(h => h.coverage < 90).length >= 3).forEach(d => out.push({ id: 'rep-' + d.id, sev: 'warn', icon: 'repeat', kind: 'Repeated low count', d, title: d.domain, why: `${d.history.filter(h => h.coverage < 90).length} of the last 12 runs closed below 90%.`, at: new Date(2026, 9, 6, 7, 0) }));
  out.push({ id: 'int-moz', sev: 'warn', icon: 'plug', kind: 'Integration', d: null, title: 'Mozenda API', why: '6 sync errors in the last hour; status polling latency 1.4 s.', at: new Date(2026, 9, 6, 16, 2), int: 'moz' });
  DELIVERIES.filter(x => ['missing', 'upload', 'blocked'].includes(x.st)).forEach(x => out.push({ id: 'dlv-' + x.id, sev: x.st === 'upload' ? 'serious' : 'crit', icon: 'calendar', kind: 'Delivery ' + DST[x.st].label.toLowerCase(), d: x.d, title: x.d.domain, why: x.reason, at: x.st === 'missing' ? x.due : NOW, dlv: x.id }));
  POOLS.forEach(p => { const s = poolStats(p); if (s.tone !== 'ok') out.push({ id: 'px-' + p.id, sev: s.tone, icon: 'globe', kind: 'Proxy pool', d: null, title: p.id + ' · ' + PROVIDERS[p.prov].name, why: p.issue || `Pool at ${s.util.toFixed(0)}% of allocation.`, at: new Date(2026, 9, 6, 15, 44), pool: p.id }); });
  out.push({ id: 'int-ig', sev: 'crit', icon: 'plug', kind: 'Integration', d: null, title: 'Input Generator', why: '2 batches rejected (HTTP 422) for zara.com.', at: new Date(2026, 9, 6, 15, 45), int: 'ig' });
  const rank = { crit: 0, serious: 1, warn: 2, idle: 3 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev] || b.at - a.at);
}

function attentionRow(d) {
  const st = d.status; const tone = ST[st].tone; const tk = d.tickets.find(isOpen);
  let metric = '';
  if (st === 'lowcount') metric = `Coverage <b class="num" style="color:var(--crit)">${pct(cov(d))}</b> · Baseline ${fmtN(d.baseline)} · Captured ${fmtN(d.captured)}`;
  else if (st === 'delayed') metric = `Progress ${d.progress}% · last heartbeat 15:45 · ${d.seq}`;
  else if (st === 'blocked') metric = `Blocked since ${fmtD(d.block.since)} · ${d.block.scope} · ETA ${d.block.eta}`;
  else if (st === 'failed') metric = `Halted at ${d.progress}% · ${fmtN(d.captured)} records · ${d.seq}`;
  else if (st === 'atrisk') metric = `Progress ${d.progress}% · coverage ${pct(cov(d))} · window ends ${fmtD(d.expected)}`;
  return `<div class="att-r" data-nav="domain" data-id="${d.id}"><span class="sev ${tone}"></span><span class="ic ${tone}">${ic(ST[st].icon)}</span>
  <div class="d1" style="min-width:0"><b>${d.domain}</b><span>${CLIENTS[d.client].name} · ${d.type}</span></div>
  <div class="d2"><span class="why">${d.note}</span><span>${metric}</span></div>
  <div class="d3">${who(d.maint)}</div>
  <div class="d4">${chip(st)}<div style="margin-top:4px">${tk ? tktLink(tk.id) : '<span class="muted" style="font-size:11.5px">No ticket</span>'}</div></div></div>`;
}

function runsTable(list, key, opts = {}) {
  const fs = F(key + 'St', opts.defSt || 'all'), fc = F(key + 'Cl', 'all'), fm = F(key + 'Mt', 'all'), ft = F(key + 'Ty', 'all'), fw = F(key + 'Wn', 'all'), q = F(key + 'Q', '').toLowerCase();
  let rows = list.filter(d => stMatch(d, fs) && (fc === 'all' || d.client === fc) && (fm === 'all' || (fm === 'none' ? !d.maint : d.maint === fm)) && (ft === 'all' || d.type === ft) && (fw === 'all' || d.win === fw) && (!q || (d.domain + CLIENTS[d.client].name + d.runId + (d.maint ? P[d.maint].name : '')).toLowerCase().includes(q)));
  const sk = F(key + 'Sort', 'sev');
  const sorters = { sev: sortDom, cov: (a, b) => (a.status === 'waiting') - (b.status === 'waiting') || cov(a) - cov(b), prog: (a, b) => b.progress - a.progress, cap: (a, b) => b.captured - a.captured, base: (a, b) => b.baseline - a.baseline };
  rows.sort(sorters[sk]);
  const th = (l, k, r) => `<th class="${r ? 'r ' : ''}sortable" data-ft="${key}Sort" data-v="${k}">${l}${sk === k ? ' ↓' : ''}</th>`;
  const stOpts = [['all', 'All statuses'], ['active', 'Active'], ['issues', 'Needs attention'], ['running', 'Healthy (running)'], ['lowcount', 'Low count'], ['risk', 'At risk / delayed'], ['failed', 'Failed'], ['blocked', 'Blocked'], ['done', 'Completed'], ['waiting', 'Scheduled'], ['tickets', 'Has open ticket']];
  const filters = `<div class="bar">${searchBox(key + 'Q', 'Filter by domain, client, run…', 230)}${sel(key + 'St', stOpts, opts.defSt || 'all', 'Status')}${opts.noClient ? '' : sel(key + 'Cl', clientOpts(), 'all', 'Client')}${opts.noMaint ? '' : sel(key + 'Mt', maintOpts(), 'all', 'Delivery engineer')}${sel(key + 'Ty', typeOpts, 'all', 'Scrape type')}${sel(key + 'Wn', winOpts, 'all', 'Run window')}${(fs !== (opts.defSt || 'all') || fc !== 'all' || fm !== 'all' || ft !== 'all' || fw !== 'all' || q) ? `<button class="btn ghost sm" data-act="clearf" data-id="${key}">${ic('x', 'sm')}Clear</button>` : ''}</div>`;
  const body = rows.map(d => {
    const tone = ST[d.status].tone; const quiet = ['running', 'done', 'waiting'].includes(d.status);

    <td>${d.type}</td>${opts.noMaint ? '' : `<td>${who(d.maint)}</td>`}<td>${d.win}</td>
    <td>${d.status === 'waiting' ? '<span class="muted">Not started</span>' : progBar(d.progress, d.status === 'running' ? 'info' : tone)}</td>
    <td class="r num">${d.captured ? fmtN(d.captured) : '—'}</td><td class="r num fg2">${fmtN(d.baseline)}</td>
    <td>${covCell(cov(d), d.status, d.threshold)}</td><td>${chip(d.status)}</td><td>${tktCell(d)}</td></tr>`;
  }).join('');
  return `<div class="card" id="${key}-card"><div class="card-h"><h3>${opts.title || 'Runs'}</h3><span class="sub">${rows.length} of ${list.length}</span><div class="r">${opts.right || ''}</div></div>

}

SCREENS.overview = () => {
  const L = visibleDomains(); const A = L.filter(d => ACTIVE.includes(d.status));
  const c = s => L.filter(d => d.status === s).length;
  const healthy = c('running'), risk = c('atrisk') + c('delayed'), failed = c('failed'), low = c('lowcount'), done = c('done'), wait = c('waiting');
  const openT = TICKETS.filter(t => isOpen(t) && roleScope()(DM[t.domain]));
  const score = Math.round((healthy + done) / Math.max(1, A.length + done) * 100);
  const ovs = F('ovSt', 'active');
  const scoped = ['maintainer', 'csm'].includes(S.role);
  const kp = (k, label, v, delta, dcls, sw) => `<button class="kpi ${ovs === k ? 'on' : ''}" data-act="kpi" data-id="${k}" data-tip="Filter the runs table">
    <span class="l">${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${label}</span><span class="v">${v}</span><span class="d"><span class="${dcls}">${delta}</span></span></button>`;
  const seg = [['running', 'Healthy', healthy, 'var(--ok-fill)'], ['risk', 'At risk', risk, 'var(--warn-fill)'], ['lowcount', 'Low count', low, 'var(--serious-fill)'], ['failed', 'Failed', failed, 'var(--crit-fill)'], ['blocked', 'Blocked', c('blocked'), 'var(--blk)'], ['waiting', 'Scheduled', wait, 'var(--border-2)']];
  const segTot = seg.reduce((a, s) => a + s[2], 0);
  const iss = L.filter(d => ISSUE.includes(d.status)).sort(sortDom);
  const unas = L.filter(d => !d.maint);
  const loadRows = MAINT.map(m => { const ds = DOMAINS.filter(d => d.maint === m); return { m, n: ds.length, iss: ds.filter(d => ISSUE.includes(d.status)).length, act: ds.filter(d => d.status === 'running').length, other: ds.filter(d => ['done', 'waiting'].includes(d.status)).length }; }).sort((a, b) => b.iss - a.iss || b.n - a.n);
  const maxN = Math.max(...loadRows.map(r => r.n));
  const upcoming = L.filter(d => d.status === 'waiting' || d.status === 'done').map(d => ({ d, at: d.nextStart })).sort((a, b) => a.at - b.at).slice(0, 6);
  const recentT = openT.sort((a, b) => b.created - a.created).slice(0, 5);

  return `
  <div class="ph"><div><h1>Operations Overview</h1><p>Monitor active scraping runs, data coverage and operational issues.</p></div>
  <div class="ph-r">${scoped ? tabs('scopeAllT', [['mine', ROLES[S.role].scopeName], ['all', 'All operations']], S.f.scopeAll ? 'all' : 'mine').replace(/data-ft="scopeAllT"/g, 'data-act="scope"').replace(/data-v=/g, 'data-id=') : ''}
  ${sel('range', [['today', 'Today'], ['7d', 'Last 7 days'], ['30d', 'Last 30 days']], 'today', 'Date range')}
  <button class="btn" data-act="refresh">${ic('refresh', 'sm')}<span id="upd">Updated ${S.updated === NOW ? '1 min ago' : 'just now'}</span></button>
  <span class="tag">${ic('calendar', 'xs')}Current Window: Tue–Fri</span></div></div>
  ${(bl => bl.length ? `<div class="banner blk">${ic('ban')}<span><b>${bl.length} domain${bl.length > 1 ? 's are' : ' is'} blocked by the site${S.role === 'csm' ? ', affecting ' + [...new Set(bl.map(d => CLIENTS[d.client].name))].join(' and ') : ''}:</b> ${bl.map(d => `<button class="ent" data-nav="domain" data-id="${d.id}">${d.domain}</button> (${d.block.scope.toLowerCase()}, since ${fmtD(d.block.since).slice(0, 6)}, ETA ${d.block.eta.split(',')[0]})`).join(', ')}</span></div>` : '')(L.filter(d => d.status === 'blocked'))}
  ${scoped && !S.f.scopeAll ? `<div class="banner info">${ic('eye')}<span>Showing <b>${ROLES[S.role].scopeName.toLowerCase()}</b>: ${L.length} domains${S.role === 'csm' ? ' across ' + new Set(L.map(d => d.client)).size + ' clients' : ''}.</span><div class="r"><button class="btn sm" data-act="scope" data-id="all">Show all operations</button></div></div>` : ''}
  <div class="kpis">
    ${kp('active', 'Active Runs', A.length, '+2 vs last Tue', 'muted')}
    ${kp('running', 'Healthy', healthy, Math.round(healthy / Math.max(1, A.length) * 100) + '% of active', 'muted', 'var(--ok-fill)')}
    ${kp('risk', 'At Risk', risk, risk ? '▲ 1 since 14:00' : 'None', risk ? 'up-bad' : 'muted', 'var(--warn-fill)')}
    ${kp('failed', 'Failed', failed, failed ? '▲ 2 vs yesterday' : 'None', failed ? 'up-bad' : 'muted', 'var(--crit-fill)')}
    ${kp('blocked', 'Blocked Domains', c('blocked'), c('blocked') ? 'oldest since ' + fmtD(new Date(Math.min(...L.filter(d => d.block).map(d => d.block.since)))).slice(0, 6) : 'None', c('blocked') ? 'up-bad' : 'muted', 'var(--blk)')}
    ${kp('lowcount', 'Low Count Alerts', low, low ? '▲ 2 vs last window' : 'None', low ? 'up-bad' : 'muted', 'var(--serious-fill)')}
    ${kp('tickets', 'Open Jira Tickets', openT.length, openT.filter(t => t.pri === 'P1').length + ' P1 · ' + openT.filter(t => t.created > new Date(2026, 9, 6)).length + ' new today', 'muted')}
  </div>
  <div class="card health" style="margin-bottom:14px">
    <div><div class="muted" style="font-size:12px;margin-bottom:6px">Overall run health</div><div class="hero-n">${score}<small>%</small></div><div style="font-size:12px;color:var(--fg-2);margin-top:8px">${healthy + done} of ${A.length + done} runs on track this window</div><div style="font-size:12px;margin-top:2px" class="${score < 85 ? 'up-bad' : 'down-good'}">${score < 85 ? '▼ 6 pts vs last window' : '▲ on target'}</div></div>
    <div><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px"><b style="font-weight:600">Run status</b><span class="muted" style="font-size:12px">${segTot} runs this window · ${done} completed</span></div>
      <div class="segbar">${seg.filter(s => s[2]).map(s => `<button style="flex:${s[2]};background:${s[3]}" data-act="kpi" data-id="${s[0]}" data-tip="<b>${s[1]}</b><div>${s[2]} runs · ${pct(s[2] / segTot * 100, 0)}</div>" aria-label="${s[1]} ${s[2]}"></button>`).join('')}</div>
      <div class="seglg">${seg.map(s => `<button data-act="kpi" data-id="${s[0]}"><i style="background:${s[3]}"></i><b>${s[2]}</b><span>${s[1]}</span></button>`).join('')}</div></div>
    <div><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-weight:600">Last 14 days</b><span class="muted" style="font-size:11.5px">runs per day</span></div>
      ${stackCols({ labels: DAYS14.map(d => d.getDate()), series: [{ name: 'Healthy', color: 'var(--ok-fill)', values: HEALTH14.map(x => x.healthy) }, { name: 'At risk / low', color: 'var(--warn-fill)', values: HEALTH14.map(x => x.risk) }, { name: 'Failed', color: 'var(--crit-fill)', values: HEALTH14.map(x => x.failed) }], h: 120, w: 300, tipLabel: i => fmtD(DAYS14[i]) })}</div>
  </div>

  <div class="grid g-main">
    <div class="card"><div class="card-h"><h3>${ic('alert', 'sm')}Attention required</h3><span class="chip crit">${iss.length + unas.length + DELIVERIES.filter(x => ['missing', 'upload'].includes(x.st) && L.includes(x.d)).length} open</span><span class="sub">Sorted by severity</span><div class="r"><button class="btn ghost sm" data-go="alerts">All alerts ${ic('right', 'sm')}</button></div></div>
      <div class="att">${iss.map(attentionRow).join('') || '<div class="empty">Nothing needs attention. All runs are on track.</div>'}
      ${DELIVERIES.filter(x => ['missing', 'upload'].includes(x.st) && L.includes(x.d)).map(x => `<div class="att-r" data-act="dlv" data-id="${x.id}"><span class="sev crit"></span><span class="ic crit">${ic('calendar')}</span><div class="d1"><b>${x.d.domain}</b><span>${CLIENTS[x.d.client].name} · delivery ${x.week === 'prev' ? 'last week' : 'due ' + dueStr(x.due)}</span></div><div class="d2"><span class="why">${x.st === 'missing' ? 'Delivery missing' : 'Delivery upload failed'}</span><span>${x.reason}</span></div><div class="d3">${who(x.d.maint)}</div><div class="d4">${dlvChip(x.st)}</div></div>`).join('')}
      ${unas.map(d => `<div class="att-r" data-nav="domain" data-id="${d.id}"><span class="sev idle"></span><span class="ic idle">${ic('user')}</span><div class="d1"><b>${d.domain}</b><span>${CLIENTS[d.client].name} · ${d.type}</span></div><div class="d2"><span class="why">Unassigned domain</span><span>First run window ${fmtD(d.nextStart)} · baseline ${fmtN(d.baseline)}</span></div><div class="d3">${who(null)}</div><div class="d4">${canEdit() ? `<button class="btn sm" data-act="assign" data-id="${d.id}">Assign</button>` : chip('waiting')}</div></div>`).join('')}</div></div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Team load</h3><span class="sub">domains · open issues</span><div class="r"><button class="btn ghost sm" data-go="team">Team ${ic('right', 'sm')}</button></div></div>
        <div>${loadRows.map(r => `<div class="load" data-act="member" data-id="${r.m}" data-tip="<b>${P[r.m].name}</b><div class='tr'><span><i style='background:var(--crit-fill)'></i>Issues</span><b>${r.iss}</b></div><div class='tr'><span><i style='background:var(--s1)'></i>Running</span><b>${r.act}</b></div><div class='tr'><span><i style='background:var(--border-2)'></i>Done / scheduled</span><b>${r.other}</b></div>">${av(r.m)}<span class="nm">${P[r.m].name}</span><div class="stk" style="max-width:${r.n / maxN * 100}%">${r.iss ? `<i style="flex:${r.iss};background:var(--crit-fill)"></i>` : ''}<i style="flex:${r.act};background:var(--s1)"></i>${r.other ? `<i style="flex:${r.other};background:var(--border-2)"></i>` : ''}</div><span class="n">${r.n} · <b style="color:${r.iss ? 'var(--crit)' : 'var(--muted)'}">${r.iss}</b></span></div>`).join('')}</div></div>
      <div class="card"><div class="card-h"><h3>Proxy pools</h3><span class="sub">period usage</span><div class="r"><button class="btn ghost sm" data-go="proxies">Proxies ${ic('right', 'sm')}</button></div></div>
        <div>${POOLS.map(p => ({ p, s: poolStats(p) })).sort((a, b) => ({ crit: 0, warn: 1, ok: 2 })[a.s.tone] - ({ crit: 0, warn: 1, ok: 2 })[b.s.tone] || b.s.util - a.s.util).slice(0, 5).map(({ p, s }) => `<div class="load" data-act="pool" data-id="${p.id}">${provLogo(p.prov, 22)}<span class="nm mono" style="font-size:12px">${p.id}</span><div style="flex:1;min-width:0;overflow:hidden">${utilBar(s.util, PROVIDERS[p.prov].name)}</div>${s.tone === 'ok' ? '<span class="lvl Normal" style="min-width:66px">OK</span>' : `<span class="lvl ${s.tone === 'crit' ? 'High' : 'Elevated'}" style="min-width:66px">${s.status}</span>`}</div>`).join('')}</div></div>
      <div class="card"><div class="card-h"><h3>Recent tickets</h3><div class="r"><button class="btn ghost sm" data-go="tickets">All ${ic('right', 'sm')}</button></div></div>
        <div>${recentT.map(t => `<div class="li" data-act="ticket" data-id="${t.id}"><span class="sev ${t.pri === 'P1' ? 'crit' : t.pri === 'P2' ? 'serious' : 'idle'}" style="height:28px"></span><div class="grow"><b><span class="mono" style="color:var(--accent)">${t.id}</span> · ${t.reason}</b><span>${t.domain} · ${t.maint ? P[t.maint].name : 'Unassigned'}</span></div><span class="muted" style="font-size:11.5px">${ago(t.created)}</span></div>`).join('')}</div></div>
    </div>
  </div>

  <div class="sec">${runsTable(L, 'ov', { title: 'Active runs', defSt: 'active', maxH: 560, right: `<button class="btn ghost sm" data-go="runs">Open full view ${ic('right', 'sm')}</button>` })}</div>

  <div class="grid g-main2 sec">
    <div class="card"><div class="card-h"><h3>Average data coverage</h3><span class="sub">actual vs baseline · last 12 weeks</span></div><div class="card-b">
      <div class="lg"><span><i class="ln" style="background:var(--s1)"></i>Avg coverage</span><span><i class="dsh"></i>Ticket threshold</span></div>
      ${lineChart({ labels: WEEKS.map(fmtShort), series: [{ name: 'Avg coverage', color: 'var(--s1)', values: W_COVER }], yMin: 85, yMax: 100, threshold: 90, h: 190, fmt: v => v.toFixed(1) + '%', yFmt: v => v + '%', tipLabel: i => 'Week of ' + fmtShort(WEEKS[i]) })}</div></div>
    ${nextDeliveriesCard(L)}<div hidden>${upcoming.map(({ d, at }) => `<div class="li" data-nav="domain" data-id="${d.id}"><div style="width:46px;text-align:center;flex:none"><div style="font-size:11px;color:var(--muted)">${DOW[at.getDay()]}</div><div style="font-weight:600;font-size:15px">${at.getDate()}</div></div><div class="grow"><b>${d.domain}</b><span>${CLIENTS[d.client].name} · ${d.type} · ${d.win}</span></div>${d.maint ? av(d.maint) : `<span class="tag">${ic('alert', 'xs')}No owner</span>`}</div>`).join('')}</div></div>
  </div>`;
};

SCREENS.runs = () => {
  const L = visibleDomains();
  return `${crumbs([['Operations'], ['Active Runs']])}<div class="ph"><div><h1>Active Runs</h1><p>Every run in the current window. Problems are listed first; healthy runs stay muted.</p></div><div class="ph-r"><button class="btn" data-act="refresh">${ic('refresh', 'sm')}Refresh</button></div></div>
  ${statStrip(L)}${runsTable(L, 'ar', { title: 'Runs in window', defSt: 'all' })}`;
};
function statStrip(L, keyAct = 'arSt') {
  const n = s => L.filter(d => stMatch(d, s)).length;
  const it = [['active', 'Active', null], ['running', 'Healthy', 'var(--ok-fill)'], ['risk', 'At risk / delayed', 'var(--warn-fill)'], ['lowcount', 'Low count', 'var(--serious-fill)'], ['failed', 'Failed', 'var(--crit-fill)'], ['blocked', 'Blocked', 'var(--blk)'], ['done', 'Completed', 'var(--muted)'], ['waiting', 'Scheduled', 'var(--border-2)']];
  return `<div class="stats">${it.map(([k, l, c]) => `<button data-ft="${keyAct}" data-v="${k}"><label>${l}</label><b>${c ? `<i style="background:${c}"></i>` : ''}${n(k)}</b></button>`).join('')}</div>`;
}

function domainListTable(list, key, title) {
  const ft = F(key + 'Tab', 'all');
  const counts = k => list.filter(d => stMatch(d, k)).length;
  const rows = list.filter(d => stMatch(d, ft)).sort(sortDom);
  return `<div class="card"><div class="card-h">${tabs(key + 'Tab', [['all', 'All', list.length], ['running', 'Running', counts('running')], ['risk', 'At Risk', counts('risk')], ['lowcount', 'Low Count', counts('lowcount')], ['failed', 'Failed', counts('failed')], ['blocked', 'Blocked', counts('blocked')], ['done', 'Completed', counts('done')], ['waiting', 'Scheduled', counts('waiting')]], 'all')}<div class="r"><span class="sub">${title || ''}</span></div></div>
  <div class="tw"><table class="t"><thead><tr><th></th><th>Domain</th><th>Client</th><th>Scrape type</th><th>Current run</th><th>Progress</th><th class="r">Baseline</th><th class="r">Captured</th><th>Coverage</th><th>Next window</th><th>Status</th><th>Tickets</th><th>Last 12 runs</th></tr></thead><tbody>
  ${rows.map(d => `<tr class="${['running', 'done', 'waiting'].includes(d.status) ? 'quiet' : ''}" data-nav="domain" data-id="${d.id}"><td class="sevc"><i class="sev ${ISSUE.includes(d.status) ? ST[d.status].tone : ''}"></i></td><td>${domLink(d.id)}${d.note && ISSUE.includes(d.status) ? `<span class="sub" style="font-family:var(--font);max-width:240px;overflow:hidden;text-overflow:ellipsis">${d.note}</span>` : ''}</td><td>${cliLink(d.client)}</td><td>${d.type}</td><td>${d.status === 'waiting' ? '<span class="muted">—</span>' : runLink(d)}</td><td>${d.status === 'waiting' ? '<span class="muted">Not started</span>' : progBar(d.progress, d.status === 'running' ? 'info' : ST[d.status].tone)}</td><td class="r num fg2">${fmtN(d.baseline)}</td><td class="r num">${d.captured ? fmtN(d.captured) : '—'}</td><td>${covCell(cov(d), d.status)}</td><td>${fmtD(d.nextStart)}</td><td>${chip(d.status)}</td><td>${tktCell(d)}</td><td data-tip="Coverage of last 12 runs; red points closed below 90%">${spark(d.history.map(h => h.coverage), 'var(--s1)', 84, 22, 90)}</td></tr>`).join('') || `<tr><td colspan="13" class="empty">No domains in this state.</td></tr>`}</tbody></table></div></div>`;
}

SCREENS.mydomains = () => {
  const m = S.role === 'maintainer' ? 'sarah' : F('mdM', 'sarah');
  const L = DOMAINS.filter(d => d.maint === m);
  const need = L.filter(d => ISSUE.includes(d.status));
  const tk = TICKETS.filter(t => isOpen(t) && t.maint === m);
  return `<div class="ph"><div><h1>My Domains</h1><p>Domains assigned to ${S.role === 'maintainer' ? 'you' : P[m].name} and their current operational status.</p></div><div class="ph-r">${S.role !== 'maintainer' ? `<span class="muted" style="font-size:12px">Viewing as</span>${sel('mdM', MAINT.map(x => [x, P[x].name]), 'sarah', 'Delivery engineer')}` : ''}<button class="btn" data-act="refresh">${ic('refresh', 'sm')}Refresh</button></div></div>
  ${need.length ? `<div class="banner serious">${ic('alert')}<span><b>${need.length} domain${need.length > 1 ? 's' : ''} need${need.length > 1 ? '' : 's'} you today:</b> ${need.map(d => `<button class="ent" data-nav="domain" data-id="${d.id}">${d.domain}</button> (${ST[d.status].label.toLowerCase()})`).join(', ')}</span></div>` : `<div class="banner info">${ic('check')}<span>All of your runs are on track.</span></div>`}
  <div class="stats"><div><label>Assigned domains</label><b>${L.length}</b></div><button data-ft="mdTab" data-v="running"><label>Running</label><b><i style="background:var(--ok-fill)"></i>${L.filter(d => d.status === 'running').length}</b></button><button data-ft="mdTab" data-v="all"><label>Need attention</label><b><i style="background:var(--crit-fill)"></i>${need.length}</b></button><button data-go="tickets:mine"><label>Open tickets</label><b>${tk.length}</b></button><div><label>Next window starts</label><b style="font-size:15px;padding-top:4px">${fmtD(L.filter(d => d.status === 'waiting').map(d => d.nextStart).sort((a, b) => a - b)[0] || L[0].nextStart)}</b></div></div>
  <div class="card" style="margin-bottom:14px"><div class="card-h"><h3>${ic('calendar', 'sm')}${S.role === 'maintainer' ? 'My deliveries' : 'Deliveries'}, in deadline order</h3><span class="sub">this week · not yet delivered</span><div class="r"><button class="btn ghost sm" data-go="${S.role === 'maintainer' ? 'deliveries:mine' : 'deliveries'}">Timeline & history ${ic('right', 'sm')}</button></div></div>${dlvTable(DELIVERIES.filter(x => x.d.maint === m && x.st !== 'delivered').sort((a, b) => (a.st === 'missing' ? -1 : 0) - (b.st === 'missing' ? -1 : 0) || a.due - b.due), true)}</div>
  ${domainListTable(L, 'md', 'Problems first')}`;
};

SCREENS.domains = () => {
  const L = visibleDomains(); const q = F('dmQ', '').toLowerCase(); const fc = F('dmCl', 'all'); const fm = F('dmMt', 'all');
  const list = L.filter(d => (!q || d.domain.includes(q)) && (fc === 'all' || d.client === fc) && (fm === 'all' || (fm === 'none' ? !d.maint : d.maint === fm)));
  return `${crumbs([['Clients'], ['Domains']])}<div class="ph"><div><h1>Domains</h1><p>${L.length} domains across ${new Set(L.map(d => d.client)).size} clients.</p></div><div class="ph-r">${searchBox('dmQ', 'Search domains…', 200)}${sel('dmCl', clientOpts(), 'all', 'Client')}${sel('dmMt', maintOpts(), 'all', 'Delivery engineer')}</div></div>${domainListTable(list, 'dm')}`;
};

/* ---------- Domain detail ---------- */
function covMeter(d, big) {
  const c = cov(d); const col = d.status === 'done' ? 'var(--ok-fill)' : c < 80 && ISSUE.includes(d.status) ? 'var(--crit-fill)' : c < 90 && ISSUE.includes(d.status) ? 'var(--serious-fill)' : 'var(--info)';
  return `<div class="bigmeter"><div class="t"><i style="width:${Math.min(100, c)}%;background:${col}"></i>${d.status !== 'done' && d.status !== 'waiting' ? `<span class="pace" style="left:${d.progress}%" data-tip="Expected at current progress (${d.progress}%)"></span>` : ''}<span class="th" style="left:${d.threshold}%" data-tip="Ticket threshold ${d.threshold}%"></span></div>
  <div class="lbls"><span style="left:0;transform:none">0</span>${d.status !== 'done' && d.status !== 'waiting' && Math.abs(d.progress - d.threshold) > 9 ? `<span style="left:${d.progress}%">pace ${d.progress}%</span>` : ''}<span style="left:${d.threshold}%;color:var(--fg);font-weight:500">${d.threshold}% threshold</span><span style="left:100%;transform:translateX(-100%)">100%</span></div></div>`;
}
function blockCard(d) {
  if (!d.block || d.status !== 'blocked') return '';
  const b = d.block; const tk = d.tickets.find(t => isOpen(t) && t.reason === 'Blocked Domain');
  return `<div class="card blk-card"><div class="card-h"><h3>${ic('ban', 'sm')}Domain blocked</h3><span class="chip blk">${ic('ban')}${b.scope}</span><span class="sub">for ${fmtDur(NOW - b.since)}</span><div class="r">${tk ? tktLink(tk.id) : `<button class="btn sm" data-act="tpl" data-id="${d.id}|blocked">Create blocked ticket</button>`}</div></div>
  <div class="card-b"><div class="kv"><div><label>Blocked since</label><b>${fmtD(b.since)} ${hm(b.since)}</b></div><div><label>Crawl types affected</label><b>${b.scope}</b></div><div><label>Cause</label><b style="white-space:normal">${b.cause}</b></div><div><label>Workaround</label><b style="white-space:normal">${b.workaround}</b></div><div><label>Expected recovery</label><b>${b.eta}</b></div><div><label>Client impact</label><b style="white-space:normal">${b.impact}</b></div></div>
  <div class="bar" style="margin-top:12px"><button class="btn sm" data-act="pool" data-id="${d.proxy.pool}">${ic('globe', 'sm')}Proxy pool ${d.proxy.pool}</button><button class="btn sm" data-act="dlvact" data-id="${(dlvOf(d) || {}).id}|csm">${ic('msg', 'sm')}Notify CSM (${P[CLIENTS[d.client].csm].name})</button></div></div></div>`;
}
function currentRunCard(d) {
  const c = cov(d); const below = c < d.threshold && ISSUE.includes(d.status) && d.status !== 'blocked';
  if (d.status === 'waiting') return `<div class="card"><div class="card-h"><h3>Current run</h3>${chip('waiting')}</div><div class="card-b"><p style="margin:0" class="fg2">No run in progress. Next window starts <b>${fmtD(d.nextStart)} 06:00</b> (${d.win}). Inputs will be generated 30 min before start.</p></div></div>`;
  const mk = (l, v, sub) => `<div><label class="muted" style="font-size:11.5px;display:block">${l}</label><b class="num" style="font-size:17px;font-weight:600">${v}</b>${sub ? `<div class="muted" style="font-size:11.5px">${sub}</div>` : ''}</div>`;

function clientStats(k) {
  const ds = DOMAINS.filter(d => d.client === k); const act = ds.filter(d => ACTIVE.includes(d.status));
  const iss = ds.filter(d => ISSUE.includes(d.status)); const ot = TICKETS.filter(t => t.client === k && isOpen(t));
  const covs = act.concat(ds.filter(d => d.status === 'done'));
  const avgCov = covs.length ? covs.reduce((a, d) => a + Math.min(cov(d) / Math.max(d.progress, 1) * 100, 105), 0) / covs.length : 100;
  const worst = iss.some(d => d.status === 'failed' || d.status === 'blocked') ? 'crit' : iss.some(d => d.status === 'lowcount') ? 'serious' : iss.length ? 'warn' : 'ok';
  const health = { crit: ['crit', 'Impacted', 'octx'], serious: ['serious', 'At risk', 'down'], warn: ['warn', 'Watch', 'alert'], ok: ['ok', 'Healthy', 'check'] }[worst];
  return { ds, act, iss, ot, avgCov, health, worst, healthy: ds.filter(d => ['running', 'done'].includes(d.status)).length };
}
